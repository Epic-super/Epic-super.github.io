        const knownCountEl = document.getElementById('knownCount');
        const learningCountEl = document.getElementById('learningCount');

        // 打卡功能 DOM 元素
        const checkInBtn = document.getElementById('checkInBtn');
        const lastCheckInDateEl = document.getElementById('lastCheckInDate');
        const consecutiveCheckInDaysEl = document.getElementById('consecutiveCheckInDays');

        let lastCheckInDate = null;
        let consecutiveCheckInDays = 0;

        function loadCheckInData() {
            const storedLastCheckIn = localStorage.getItem('wordMemLastCheckIn');
            const storedConsecutiveDays = localStorage.getItem('wordMemConsecutiveDays');

            if (storedLastCheckIn) {
                lastCheckInDate = storedLastCheckIn;
                lastCheckInDateEl.textContent = lastCheckInDate;
            } else {
                lastCheckInDateEl.textContent = "从未";
            }

            if (storedConsecutiveDays) {
                consecutiveCheckInDays = parseInt(storedConsecutiveDays, 10);
                consecutiveCheckInDaysEl.textContent = consecutiveCheckInDays;
            } else {
                consecutiveCheckInDaysEl.textContent = "0";
            }
            updateCheckInButtonState();
        }

        function updateCheckInButtonState() {
            const today = new Date().toLocaleDateString('zh-CN');
            if (lastCheckInDate === today) {
                checkInBtn.textContent = "今日已打卡";
                checkInBtn.disabled = true;
            } else {
                checkInBtn.textContent = "今日打卡";
                checkInBtn.disabled = false;
            }
        }

        function handleCheckIn() {
            const today = new Date();
            const todayStr = today.toLocaleDateString('zh-CN');

            if (lastCheckInDate === todayStr) {
                // 防止重复打卡 (理论上按钮已禁用，但作为双重保险)
                return;
            }

            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const yesterdayStr = yesterday.toLocaleDateString('zh-CN');

            if (lastCheckInDate === yesterdayStr) {
                consecutiveCheckInDays++;
            } else {
                // 如果不是昨天打的卡，或者从未打卡，则连续天数重置为1
                consecutiveCheckInDays = 1;
            }

            lastCheckInDate = todayStr;

            localStorage.setItem('wordMemLastCheckIn', lastCheckInDate);
            localStorage.setItem('wordMemConsecutiveDays', consecutiveCheckInDays.toString());

            lastCheckInDateEl.textContent = lastCheckInDate;
            consecutiveCheckInDaysEl.textContent = consecutiveCheckInDays;
            updateCheckInButtonState();
        }

        checkInBtn.addEventListener('click', handleCheckIn);

        function updateProgress() {
            currentIndexDisplayEl.textContent = wordsToLearn.length > 0 ? currentWordLearnIndex + 1 : 0;
            totalWordsDisplayEl.textContent = wordsToLearn.length;
            totalVocabularySizeEl.textContent = cet6Vocabulary.length;
            knownCountEl.textContent = knownWords.length;
            learningCountEl.textContent = wordsToLearn.length - (currentWordLearnIndex + 1) >=0 ? wordsToLearn.length - (currentWordLearnIndex + 1) : 0 ;
             if (wordsToLearn.length === 0 && cet6Vocabulary.length > 0) { // 所有单词都学完了
                learningCountEl.textContent = 0;
            }
        }

        function loadNextWord() {
            if (wordsToLearn.length === 0) {
                wordEl.textContent = "太棒了！";
                phoneticEl.textContent = "当前列表的单词已学习完毕！";
                meaningEl.classList.add('hidden');
                meaningEl.textContent = "可以尝试刷新页面重新学习，或等待更高级的复习功能。";
                currentWordData = null;
                disableButtons(true);
                updateProgress();
                return;
            }

            disableButtons(false);
            // 简单随机选择一个待学习的单词
            currentWordLearnIndex = Math.floor(Math.random() * wordsToLearn.length);
            currentWordData = wordsToLearn[currentWordLearnIndex];

            wordEl.textContent = currentWordData.word;
            phoneticEl.textContent = currentWordData.phonetic || "";
            meaningEl.textContent = currentWordData.meaning;
            meaningEl.classList.add('hidden');
            updateProgress();
        }
        
        function disableButtons(disabled) {
            toggleMeaningBtn.disabled = disabled;
            knownBtn.disabled = disabled;
            unknownBtn.disabled = disabled;
            nextBtn.disabled = disabled;
        }

        toggleMeaningBtn.addEventListener('click', () => {
            if (currentWordData) {
                meaningEl.classList.toggle('hidden');
            }
        });

        knownBtn.addEventListener('click', () => {
            if (currentWordData) {
                if (!knownWords.find(w => w.word === currentWordData.word)) {
                    knownWords.push(currentWordData);
                }
                // 从待学习列表中移除
                wordsToLearn.splice(currentWordLearnIndex, 1);
                currentWordLearnIndex--; // 调整索引，因为splice会改变数组
                loadNextWord();
            }
        });

        unknownBtn.addEventListener('click', () => {
            // 不认识，则简单进入下一个，该词仍在待学习列表
            if (currentWordData) {
                 // 确保不从空数组中选择
                if (wordsToLearn.length > 1) {
                     // 重新随机选择一个，避免连续出现同一个不认识的词
                    let nextIndex = currentWordLearnIndex;
                    while(nextIndex === currentWordLearnIndex && wordsToLearn.length > 1) { // 防止只有一个词时死循环
                        nextIndex = Math.floor(Math.random() * wordsToLearn.length);
                    }
                    currentWordLearnIndex = nextIndex;
                    currentWordData = wordsToLearn[currentWordLearnIndex];

                    wordEl.textContent = currentWordData.word;
                    phoneticEl.textContent = currentWordData.phonetic || "";
                    meaningEl.textContent = currentWordData.meaning;
                    meaningEl.classList.add('hidden');
                } else if (wordsToLearn.length === 1) {
                    // 如果只剩一个词，还是显示它
                     currentWordLearnIndex = 0;
                     currentWordData = wordsToLearn[currentWordLearnIndex];
                     wordEl.textContent = currentWordData.word;
                     phoneticEl.textContent = currentWordData.phonetic || "";
                     meaningEl.textContent = currentWordData.meaning;
                     meaningEl.classList.add('hidden');
                } else { // wordsToLearn.length === 0
                    loadNextWord(); // 会显示完成信息
                }
                updateProgress();
            }
        });

        nextBtn.addEventListener('click', () => {
            // “下一个”按钮简单地加载列表中的另一个随机词（如果还有的话）
            // 如果希望“下一个”跳过当前词并将其保留在学习列表中，则此逻辑适用
            loadNextWord();
        });
        
        function initialize() {
            wordsToLearn = [...cet6Vocabulary]; 
            knownWords = [];
            currentWordData = null;
            currentWordLearnIndex = -1;
            loadNextWord();
            loadCheckInData(); // 初始化时加载打卡数据
        }

        initialize();
    </script>
    <script src="../js/components.js"></script>
</body>
</html>
