<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具箱 - 小待的个人藏宝库</title>
    <link rel="stylesheet" href="css/style.css">
<script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head>
<body>
    <main>
        <section id="toolbox">
            <h2>工具箱</h2>
            <p>这里收集了一些我常用或自己开发的小工具，希望能提高效率。</p>

            <div class="tool-item">
                <h3>随机数生成器</h3>
                <p>生成指定范围内的随机整数。</p>
                <a href="tools/random-number-generator.html">使用工具</a>
            </div>

            <div class="tool-item">
                <h3>待办事项列表</h3>
                <p>一个简单的待办事项列表，帮助您管理任务（数据将存储在浏览器本地）。</p>
                <a href="tools/todo-list.html">使用工具</a>
            </div>

            <div class="tool-item featured-tool">
                <h3>六级单词速记</h3>
                <p>专为六级考生定制的背单词工具，助你高效记忆核心词汇。</p>
                <a href="tools/word-memorizing.html">开始学习</a>
            </div>

            <div class="tool-item">
                <h3>万能计算器</h3>
                <p>一个多功能计算器，满足日常和学习中的计算需求。</p>
                <span class="coming-soon">即将上线</span>
            </div>

            <div class="tool-item">
                <h3>学生证生成器</h3>
                <p>用于生成模拟学生证的工具。</p>
                <span class="coming-soon">即将上线</span>
            </div>

            <div class="tool-item">
                <h3>雅思成绩检查器</h3>
                <p>一个模拟的雅思成绩查询工具。</p>
                <span class="coming-soon">即将上线</span>
            </div>

            <!-- 可以根据需要添加更多工具条目 -->
            <!-- 也可以直接在此页面嵌入一些简单的工具 -->

        </section>
    </main>

    <script src="js/script.js"></script>
    <script src="js/components.js"></script>

</body>
</html>
