<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简易五子棋 · Python 小尝试</title>
<style>:root{color-scheme:dark;--bg:#0a0e1a;--card:#121828;--line:#2d3a58;--text:#e8edf7;--muted:#8a93a8;--main:#5b8cff;--py:#ffd43b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:8px 13px;cursor:pointer}.btn.primary{background:var(--main);border-color:var(--main);color:#fff}.board-wrap{display:flex;justify-content:center;padding:14px;background:#b98248;border-radius:16px;box-shadow:0 12px 30px #0005}.board{display:grid;grid-template-columns:repeat(10,1fr);width:min(90vw,560px);aspect-ratio:1;background:#d7a568;border:2px solid #70441f;gap:0;padding:3%;position:relative}.cell{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}.cell::before,.cell::after{content:"";position:absolute;background:#70441f}.cell::before{height:1px;left:0;right:0;top:50%}.cell::after{width:1px;top:0;bottom:0;left:50%}.stone{z-index:1;width:76%;height:76%;border-radius:50%;box-shadow:inset -3px -4px 5px #0005,0 2px 3px #0006}.black{background:#17202d}.white{background:#f5f2e9}.status{text-align:center;margin:15px 0;font-weight:700}.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none}.back:hover{color:var(--py)}</style><script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head>
<body><main class="wrap"><div class="top"><div><h1>🐍 简易五子棋</h1><div class="muted">由 Python 控制台版改写的浏览器试验 · 双人轮流</div></div></div><div class="actions"><button class="btn primary" id="reset">重新开始</button><span class="muted" id="count">第 1 手</span></div><div class="board-wrap"><div class="board" id="board" aria-label="五子棋棋盘"></div></div><div class="status" id="status">黑方落子</div><a class="back" href="../practice.html">← 返回 Python 小尝试</a></main>
<script>(function(){var size=10,board=document.getElementById('board'),status=document.getElementById('status'),count=document.getElementById('count'),cells=[],turn='black',moves=0,over=false;function reset(){board.innerHTML='';cells=[];turn='black';moves=0;over=false;status.textContent='黑方落子';count.textContent='第 1 手';for(var r=0;r<size;r++){cells[r]=[];for(var c=0;c<size;c++){var el=document.createElement('button');el.className='cell';el.type='button';el.setAttribute('aria-label',(r+1)+'行'+(c+1)+'列');el.dataset.r=r;el.dataset.c=c;el.addEventListener('click',play);board.appendChild(el);cells[r][c]=null;}}}function play(e){if(over)return;var el=e.currentTarget,r=+el.dataset.r,c=+el.dataset.c;if(cells[r][c])return;cells[r][c]=turn;var stone=document.createElement('span');stone.className='stone '+turn;el.appendChild(stone);moves++;count.textContent='第 '+(moves+1)+' 手';if(win(r,c)){status.textContent=(turn==='black'?'黑方':'白方')+'获胜！';over=true;return}if(moves===size*size){status.textContent='和棋';over=true;return}turn=turn==='black'?'white':'black';status.textContent=(turn==='black'?'黑方':'白方')+'落子'}function win(r,c){var dirs=[[1,0],[0,1],[1,1],[1,-1]];return dirs.some(function(d){return 1+line(r,c,d[0],d[1])+line(r,c,-d[0],-d[1])>=5})}function line(r,c,dr,dc){var n=0,rr=r+dr,cc=c+dc;while(rr>=0&&rr<size&&cc>=0&&cc<size&&cells[rr][cc]===turn){n++;rr+=dr;cc+=dc}return n}document.getElementById('reset').addEventListener('click',reset);reset();})();</script></body></html>
