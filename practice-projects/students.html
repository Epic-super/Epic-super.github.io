<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学生信息管理 · Python 小尝试</title><style>:root{color-scheme:dark;--bg:#0a0e1a;--card:#121828;--line:#2d3a58;--text:#e8edf7;--muted:#8a93a8;--main:#5b8cff;--red:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 40px}h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form input{min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#19223a;color:var(--text)}button{border:1px solid var(--line);background:#19223a;color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer}button.primary{background:var(--main);border-color:var(--main);color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{flex:1;min-width:180px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#19223a;color:var(--text)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}td button{padding:5px 8px;margin-right:5px}.danger{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:650px){.form{grid-template-columns:1fr 1fr}table{font-size:13px}.optional{display:none}}.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none}</style><script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head><body><main class="wrap"><h1>🐍 学生信息管理</h1><p class="muted">由 Python 控制台版改写的浏览器 CRUD 演示 · 数据只保存于本机浏览器</p><section class="card"><form class="form" id="form"><input id="name" placeholder="姓名" required><input id="sid" placeholder="学号" required><input id="major" placeholder="专业"><input id="score" type="number" min="0" max="100" placeholder="成绩"><button class="primary" id="save">添加学生</button></form></section><section class="card"><div class="toolbar"><input id="search" placeholder="按姓名、学号或专业搜索"><span class="muted" id="total"></span></div><div id="table"></div></section><a class="back" href="../practice.html">← 返回 Python 小尝试</a></main><script>(function(){var key='practice.students.v1',data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}var editing=-1,form=document.getElementById('form'),nameEl=document.getElementById('name'),sidEl=document.getElementById('sid'),majorEl=document.getElementById('major'),scoreEl=document.getElementById('score'),search=document.getElementById('search'),table=document.getElementById('table'),total=document.getElementById('total'),save=document.getElementById('save');function persist(){localStorage.setItem(key,JSON.stringify(data))}function render(){var q=search.value.trim().toLowerCase(),list=data.map(function(x,i){return {x:x,i:i}}).filter(function(o){return !q||[o.x.name,o.x.sid,o.x.major].join(' ').toLowerCase().includes(q)});total.textContent='共 '+list.length+' 人';if(!list.length){table.innerHTML='<div class="empty">暂无学生记录，先添加一条吧</div>';return}table.innerHTML='<table><thead><tr><th>姓名</th><th>学号</th><th class="optional">专业</th><th>成绩</th><th>操作</th></tr></thead><tbody>'+list.map(function(o){var x=o.x;return '<tr><td>'+esc(x.name)+'</td><td>'+esc(x.sid)+'</td><td class="optional">'+esc(x.major||'—')+'</td><td>'+esc(x.score||'—')+'</td><td><button data-edit="'+o.i+'">编辑</button><button class="danger" data-del="'+o.i+'">删除</button></td></tr>'}).join('')+'</tbody></table>'}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}form.addEventListener('submit',function(e){e.preventDefault();var item={name:nameEl.value.trim(),sid:sidEl.value.trim(),major:majorEl.value.trim(),score:scoreEl.value.trim()};if(!item.name||!item.sid)return;if(editing<0)data.push(item);else{data[editing]=item;editing=-1;save.textContent='添加学生'}persist();form.reset();render()});search.addEventListener('input',render);table.addEventListener('click',function(e){var edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit!==undefined){var x=data[+edit];nameEl.value=x.name;sidEl.value=x.sid;majorEl.value=x.major;scoreEl.value=x.score;editing=+edit;save.textContent='保存修改';nameEl.focus()}if(del!==undefined&&confirm('确定删除这条记录吗？')){data.splice(+del,1);persist();render()}});render()})();</script></body></html>
