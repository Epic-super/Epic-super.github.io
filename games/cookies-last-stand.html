                            ));
                        }
                        Game.shakeAmount = Math.max(Game.shakeAmount, 6);
                        proj.dead = true;
                        break;
                    } else if (proj.pierce > 0) {
                        proj.pierce--;
                    } else {
                        proj.dead = true;
                    }
                }
            }
            // Boss collision
            if (!proj.dead && Game.boss && Game.boss.spawnTimer <= 0 && Game.boss.alive) {
                if (distance(proj.x, proj.y, Game.boss.x, Game.boss.y) < Game.boss.size / 2 + proj.size) {
                    if (!proj.hitSet.has(Game.boss)) {
                        Game.boss.takeHit(proj.damage);
                        proj.hitSet.add(Game.boss);
                        for (let k = 0; k < 5; k++) {
                            const ang = Math.random() * Math.PI * 2;
                            const sp = rand(50, 140);
                            this.particles.push(new Particle(proj.x, proj.y, Math.cos(ang) * sp, Math.sin(ang) * sp, 0.35, proj.color, 3));
                        }
                        if (proj.explode > 0) {
                            Game.shakeAmount = Math.max(Game.shakeAmount, 8);
                            proj.dead = true;
                        } else if (proj.pierce > 0) {
                            proj.pierce--;
                        } else {
                            proj.dead = true;
                        }
                    }
                }
            }
            if (proj.dead) this.projectiles.splice(i, 1);
        }
        if (this.projectiles.length > CONFIG.MAX_PROJECTILES) {
            this.projectiles.splice(0, this.projectiles.length - CONFIG.MAX_PROJECTILES);
        }

        // Boss spawn timer + boss lifecycle
        if (!this.boss && this.bossSpawnTimer > 0) {
            this.bossSpawnTimer -= dt;
            if (this.bossSpawnTimer <= 0) this.spawnBoss();
        }
        if (this.boss) {
            this.boss.update(dt, this.player);
            this.boss.checkCollision(this.player);
            if (!this.boss.alive) {
                this.score += this.boss.config.killScore || 0;
                this.kills += 1;
                this.bossKills += 1;
                this.boss = null;
                this.bossSpawnTimer = CONFIG.BOSS.interval;
            }
        }

        // Boss bullets (attack the player)
        for (let i = this.bossBullets.length - 1; i >= 0; i--) {
            const b = this.bossBullets[i];
            b.update(dt);
            if (b.dead) { this.bossBullets.splice(i, 1); continue; }
            if (distance(b.x, b.y, this.player.x, this.player.y) < b.size + this.player.size / 2 - 2) {
                this.player.takeDamage(b.damage);
                b.dead = true;
            }
            if (b.dead) this.bossBullets.splice(i, 1);
        }

        // Update power-ups
        for (let i = this.powerups.length - 1; i >= 0; i--) {
            const pu = this.powerups[i];
            pu.update(dt);

            if (pu.checkCollision(this.player)) {
                pu.applyEffect(this.player);
                this.powerups.splice(i, 1);
                continue;
            }

            if (pu.isDead) {
                this.powerups.splice(i, 1);
            }
        }

        // Update slime trails
        for (let i = this.slimeTrails.length - 1; i >= 0; i--) {
            this.slimeTrails[i].update(dt);
            if (this.slimeTrails[i].isDead) {
                this.slimeTrails.splice(i, 1);
            }
        }

        // Update particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].isDead) {
                this.particles.splice(i, 1);
            }
        }
        // Limit particles
        if (this.particles.length > CONFIG.MAX_PARTICLES) {
            this.particles.splice(0, this.particles.length - CONFIG.MAX_PARTICLES);
        }

        // Spawn enemies
        this.enemySpawnTimer -= dt;
        if (this.enemySpawnTimer <= 0) {
            this.spawnEnemy();
            this.enemySpawnTimer = this.spawnInterval;
        }

        // Spawn power-ups
        this.powerupSpawnTimer -= dt;
        if (this.powerupSpawnTimer <= 0 && this.powerups.length < CONFIG.MAX_POWERUPS) {
            this.spawnPowerUp();
            this.powerupSpawnTimer = rand(8, 14);
        }

        // Clear browsing data event
        this.updateClearEvent(dt);

        // Update score (survival time)
        this.score = Math.floor(this.time * CONFIG.SCORE_PER_SECOND) + this.powerupsCollected * CONFIG.POWERUP_BONUS;
    },

    spawnEnemy() {
        this.totalSpawns++;
        const pa = CONFIG.PLAY_AREA;

        // Determine enemy type based on unlock times
        let types = ['tracker'];
        if (this.time >= CONFIG.DIFFICULTY.adScriptUnlockTime) types.push('adScript');
        if (this.time >= CONFIG.DIFFICULTY.cacheMonsterUnlockTime) types.push('cache');

        // Weight selection (more variety as time goes on)
        let type;
        if (this.time < CONFIG.DIFFICULTY.adScriptUnlockTime) {
            type = 'tracker';
        } else if (this.time < CONFIG.DIFFICULTY.cacheMonsterUnlockTime) {
            type = Math.random() < 0.6 ? 'tracker' : 'adScript';
        } else {
            const r = Math.random();
            if (r < 0.4) type = 'tracker';
            else if (r < 0.7) type = 'adScript';
            else type = 'cache';
        }

        // Spawn from random edge
        const edge = randInt(0, 3);
        let x, y;
        const margin = 10;
        if (edge === 0) { // Top
            x = rand(pa.x + margin, pa.x + pa.w - margin);
            y = pa.y + margin;
        } else if (edge === 1) { // Right
            x = pa.x + pa.w - margin;
            y = rand(pa.y + margin, pa.y + pa.h - margin);
        } else if (edge === 2) { // Bottom
            x = rand(pa.x + margin, pa.x + pa.w - margin);
            y = pa.y + pa.h - margin;
        } else { // Left
            x = pa.x + margin;
            y = rand(pa.y + margin, pa.y + pa.h - margin);
        }

        let enemy;
        if (type === 'tracker') enemy = new TrackerBeacon(x, y);
        else if (type === 'adScript') enemy = new AdScript(x, y);
        else enemy = new CacheMonster(x, y);

        this.enemies.push(enemy);

        // Spawn effect particles
        for (let i = 0; i < 4; i++) {
            this.particles.push(new Particle(
                x, y,
                rand(-30, 30), rand(-30, 30),
                0.3, enemy.config.color, 3
            ));
        }
    },

    spawnBoss() {
        const pa = CONFIG.PLAY_AREA;
        this.boss = new Boss(CONFIG.CANVAS_W / 2, pa.y - 50);
        this.bossWarnTimer = 2.8;
        // Entrance burst at the boss target position
        for (let i = 0; i < 22; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = rand(80, 200);
            this.particles.push(new Particle(
                this.boss.targetX, this.boss.targetY,
                Math.cos(a) * sp, Math.sin(a) * sp,
                0.7, '#FF6B6B', 4
            ));
        }
        AudioSystem.playStart();
    },

    spawnPowerUp() {
        const pa = CONFIG.PLAY_AREA;
        const baseTypes = ['httpsLock', 'sessionCookie', 'expiresPlus', 'privateCloak'];

        // Bias toward health items if player is low
        let type;
        if (this.player.health < 30) {
            type = Math.random() < 0.5 ? 'expiresPlus' : 'sessionCookie';
        } else if (Math.random() < 0.30) {
            type = 'weaponUp';
        } else {
            type = baseTypes[randInt(0, baseTypes.length - 1)];
        }

        const x = rand(pa.x + 40, pa.x + pa.w - 40);
        const y = rand(pa.y + 40, pa.y + pa.h - 40);

        // Don't spawn too close to player
        if (distance(x, y, this.player.x, this.player.y) < 80) {
            return; // Try again next timer
        }

        this.powerups.push(new PowerUp(x, y, type));
    },

    updateClearEvent(dt) {
        if (!this.clearEventActive) {
            this.clearEventTimer -= dt;
            if (this.clearEventTimer <= 0) {
                this.startClearEvent();
            }
        } else {
            this.clearEventProgress += dt / this.clearEventFillTime;

            // Warning sound
            this.warningSoundTimer -= dt;
            if (this.warningSoundTimer <= 0) {
                AudioSystem.playWarningLoop();
                this.warningSoundTimer = 0.5;
            }

            if (this.clearEventProgress >= 1.0) {
                this.triggerClearEvent();
            }
        }
    },

    startClearEvent() {
        this.clearEventActive = true;
        this.clearEventProgress = 0;
        this.clearEventFillTime = Math.max(
            CONFIG.CLEAR_EVENT.minFillTime,
            CONFIG.CLEAR_EVENT.initialFillTime - this.clearEventCount * CONFIG.CLEAR_EVENT.fillTimeDecrease
        );
        this.warningSoundTimer = 0;
        AudioSystem.playWarning();
    },

    triggerClearEvent() {
        // White flash
        this.flashAlpha = 1.0;
        this.shakeAmount = 20;
        AudioSystem.playClear();

        // Deal damage to player (if not shielded)
        if (!this.player.isShielded) {
            this.player.takeDamage(CONFIG.CLEAR_EVENT.damage);
        }

        // Destroy all enemies with explosion particles
        for (const enemy of this.enemies) {
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = rand(50, 150);
                this.particles.push(new Particle(
                    enemy.x, enemy.y,
                    Math.cos(angle) * speed, Math.sin(angle) * speed,
                    0.6, enemy.config.color, 4
                ));
            }
            AudioSystem.playEnemyDeath();
        }
        this.enemies = [];
        this.slimeTrails = []; // Clear slime too

        // Reset clear event
        this.clearEventActive = false;
        this.clearEventProgress = 0;
        this.clearEventCount++;
        this.clearEventInterval = Math.max(
            CONFIG.CLEAR_EVENT.minInterval,
            CONFIG.CLEAR_EVENT.initialInterval - this.clearEventCount * CONFIG.CLEAR_EVENT.intervalDecrease
        );
        this.clearEventTimer = this.clearEventInterval;

        // Brief respite - delay next enemy spawn
        this.enemySpawnTimer = Math.max(this.enemySpawnTimer, 2.0);
    },

    gameOver() {
        if (this.state !== 'playing') return;

        this.state = 'gameover';
        AudioSystem.playDeath();
        this.shakeAmount = 15;

        // Death explosion particles
        for (let i = 0; i < 20; i++) {
            const angle = (i / 20) * Math.PI * 2;
            const speed = rand(50, 200);
            this.particles.push(new Particle(
                this.player.x, this.player.y,
                Math.cos(angle) * speed, Math.sin(angle) * speed,
                0.8, i % 2 === 0 ? '#FF6B6B' : '#4ECDC4', 5
            ));
        }

        // Update high score
        if (this.score > this.highScore) {
            this.highScore = this.score;
            try {
                localStorage.setItem('cookiesLastStand_highScore', this.highScore.toString());
            } catch (e) { /* ignore */ }
        }
    },
};

// ===== RENDERER =====
const Renderer = {
    ctx: null,
    canvas: null,

    init(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        canvas.width = CONFIG.CANVAS_W;
        canvas.height = CONFIG.CANVAS_H;
        this.ctx.imageSmoothingEnabled = true;
    },

    // Main render function
    render() {
        const ctx = this.ctx;

        // Clear
        ctx.fillStyle = '#1D1F27';
        ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

        // Apply screen shake
        ctx.save();
        if (Game.shakeAmount > 0) {
            const sx = (Math.random() - 0.5) * Game.shakeAmount;
            const sy = (Math.random() - 0.5) * Game.shakeAmount;
            ctx.translate(sx, sy);
        }

        if (Game.state === 'start') {
            this.drawStartScreen();
        } else if (Game.state === 'playing' || Game.state === 'gameover') {
            this.drawGame();

            if (Game.state === 'gameover') {
                this.drawGameOverScreen();
            }
        }

        ctx.restore();

        // Flash effect (drawn over everything, not affected by shake)
        if (Game.flashAlpha > 0) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Game.flashAlpha})`;
            ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);
        }

        // Hurt vignette (red pulse around edges)
        if (Game.hurtFlash > 0) {
            const hv = ctx.createRadialGradient(
                CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2, CONFIG.CANVAS_H * 0.22,
                CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2, CONFIG.CANVAS_H * 0.72
            );
            hv.addColorStop(0, 'rgba(255, 60, 60, 0)');
            hv.addColorStop(1, `rgba(255, 40, 40, ${0.55 * Game.hurtFlash})`);
            ctx.fillStyle = hv;
            ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);
        }

        // Stage banner (top-center, fades in/out)
        if (Game.bannerTimer > 0 && Game.state === 'playing') {
            const bt = Game.bannerTimer;
            const a = Math.max(0, Math.min(1, Math.min(bt, 3 - bt) * 1.6));
            const bw = 440, bh = 56;
            const bx = (CONFIG.CANVAS_W - bw) / 2;
            const by = CONFIG.BROWSER_BAR_H + 16;
            ctx.globalAlpha = a;
            ctx.fillStyle = 'rgba(29, 31, 39, 0.88)';
            this.roundRect(ctx, bx, by, bw, bh, 10);
            ctx.fill();
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 2;
            this.roundRect(ctx, bx, by, bw, bh, 10);
            ctx.stroke();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('STAGE ' + Game.stage, CONFIG.CANVAS_W / 2, by + 19);
            ctx.fillStyle = '#4ECDC4';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillText(Game.stageBannerText, CONFIG.CANVAS_W / 2, by + 40);
            ctx.globalAlpha = 1;
        }

        // Boss incoming warning (independent of stage banner)
        if (Game.boss && Game.boss.entering && Game.bossWarnTimer > 0) {
            const wt = Game.bossWarnTimer;
            const a = Math.max(0, Math.min(1, Math.min(wt, 3 - wt) * 1.4));
            const bw = 460, bh = 60;
            const bx = (CONFIG.CANVAS_W - bw) / 2;
            const by = CONFIG.BROWSER_BAR_H + 14;
            ctx.globalAlpha = a;
            ctx.fillStyle = 'rgba(29, 31, 39, 0.9)';
            this.roundRect(ctx, bx, by, bw, bh, 10);
            ctx.fill();
            ctx.strokeStyle = '#FF6B6B';
            ctx.lineWidth = 2;
            this.roundRect(ctx, bx, by, bw, bh, 10);
            ctx.stroke();
            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚠ PURGE CORE ⚠', CONFIG.CANVAS_W / 2, by + 22);
            ctx.fillStyle = '#4ECDC4';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillText("INCOMING - CLEAR IT OR IT WON'T STOP", CONFIG.CANVAS_W / 2, by + 44);
            ctx.globalAlpha = 1;
        }
    },

    drawGame() {
        const ctx = this.ctx;

        // Draw browser frame (decorative)
        this.drawBrowserFrame();

        // Draw play area background
        this.drawPlayAreaBackground();

        // Draw slime trails (under everything)
        for (const slime of Game.slimeTrails) {
            slime.draw(ctx);
        }

        // Draw power-ups
        for (const pu of Game.powerups) {
            pu.draw(ctx);
        }

        // Draw enemies
        for (const enemy of Game.enemies) {
            enemy.draw(ctx);
        }

        // Draw boss + its bullets
        if (Game.boss) Game.boss.draw(ctx);
        for (const b of Game.bossBullets) b.draw(ctx);

        // Draw projectiles (player weapon)
        for (const proj of Game.projectiles) {
            proj.draw(ctx);
        }

        // Draw player
        if (Game.state === 'playing') {
            Game.player.draw(ctx);
        }

        // Draw particles (on top)
        for (const p of Game.particles) {
            p.draw(ctx);
        }

        // Draw HUD
        this.drawHUD();
        this.drawBossBar();

        // Draw clear event UI
        if (Game.clearEventActive) {
            this.drawClearEventUI();
        }

        // Draw touch controls
        this.drawTouchControls();
    },

    drawBrowserFrame() {
        const ctx = this.ctx;
        const barH = CONFIG.BROWSER_BAR_H;
        const mx = Input.mouse.x, my = Input.mouse.y;
        const inRect = (x, y, w, h) => Input.mouse.inside && mx >= x && mx <= x + w && my >= y && my <= y + h;

        // Browser chrome background
        ctx.fillStyle = '#23252F';
        ctx.fillRect(0, 0, CONFIG.CANVAS_W, barH);

        // Bottom border of chrome
        ctx.fillStyle = '#1D1F27';
        ctx.fillRect(0, barH - 2, CONFIG.CANVAS_W, 2);

        // Back button (left arrow)
        const backHover = inRect(8, 14, 22, 20);
        if (backHover) { ctx.fillStyle = 'rgba(78,205,196,0.18)'; ctx.fillRect(8, 14, 22, 20); }
        ctx.fillStyle = backHover ? '#4ECDC4' : '#8A93A8';
        ctx.beginPath();
        ctx.moveTo(15, barH / 2);
        ctx.lineTo(25, barH / 2 - 6);
        ctx.lineTo(25, barH / 2 + 6);
        ctx.closePath();
        ctx.fill();

        // Forward button (right arrow)
        const fwdHover = inRect(30, 14, 20, 20);
        if (fwdHover) { ctx.fillStyle = 'rgba(78,205,196,0.18)'; ctx.fillRect(30, 14, 20, 20); }
        ctx.fillStyle = fwdHover ? '#4ECDC4' : '#8A93A8';
        ctx.beginPath();
        ctx.moveTo(40, barH / 2);
        ctx.lineTo(30, barH / 2 - 6);
        ctx.lineTo(30, barH / 2 + 6);
        ctx.closePath();
        ctx.fill();

        // Refresh button (circular arrow)
        const refHover = inRect(46, 12, 24, 24);
        if (refHover) { ctx.fillStyle = 'rgba(255,107,107,0.18)'; ctx.fillRect(46, 12, 24, 24); }
        ctx.strokeStyle = refHover ? '#FF6B6B' : '#8A93A8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(55, barH / 2, 7, -Math.PI * 0.3, Math.PI * 1.1);
        ctx.stroke();
        ctx.fillStyle = refHover ? '#FF6B6B' : '#8A93A8';
        ctx.beginPath();
        ctx.moveTo(62, barH / 2 - 4);
        ctx.lineTo(58, barH / 2 - 8);
        ctx.lineTo(65, barH / 2 - 8);
        ctx.closePath();
        ctx.fill();

        // Address bar
        const addrX = 75;
        const addrW = CONFIG.CANVAS_W - 100;
        const addrH = barH - 14;
        const addrY = (barH - addrH) / 2;
        ctx.fillStyle = '#1D1F27';
        ctx.fillRect(addrX, addrY, addrW, addrH);
        ctx.strokeStyle = '#1D1F27';
        ctx.lineWidth = 1;
        ctx.strokeRect(addrX, addrY, addrW, addrH);
        ctx.fillStyle = '#4ECDC4';
        ctx.fillRect(addrX + 6, addrY + 6, 6, 5);
        ctx.strokeStyle = '#4ECDC4';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(addrX + 9, addrY + 6, 2.5, Math.PI, 0);
        ctx.stroke();
        ctx.fillStyle = '#C8D0D8';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText('cookie:survival', addrX + 18, barH / 2 + 1);

        // Menu button (three lines) on the right
        const menuHover = inRect(CONFIG.CANVAS_W - 24, 12, 18, 20);
        if (menuHover) { ctx.fillStyle = 'rgba(78,205,196,0.18)'; ctx.fillRect(CONFIG.CANVAS_W - 24, 12, 18, 20); }
        ctx.fillStyle = menuHover ? '#4ECDC4' : '#8A93A8';
        for (let i = 0; i < 3; i++) {
            ctx.fillRect(CONFIG.CANVAS_W - 22, 14 + i * 5, 14, 2);
        }

        // Register toolbar buttons for hit-testing
        Input.registerButton('back', 8, 14, 22, 20, 'toMenu');
        Input.registerButton('forward', 30, 14, 20, 20, 'toMenu');
        Input.registerButton('refresh', 46, 12, 24, 24, 'refresh');
        Input.registerButton('menu', CONFIG.CANVAS_W - 24, 12, 18, 20, 'toMenu');
    },

    drawPlayAreaBackground() {
        const ctx = this.ctx;
        const pa = CONFIG.PLAY_AREA;
        const t = Game.time;
        // Current scene theme (blends during stage transition)
        const SC = SCENES[Game.stage] || SCENES[1];
        const SPF = SCENES[Game.sceneFrom] || SC;
        const SM = (typeof Game.sceneMix === 'number' && isFinite(Game.sceneMix)) ? Game.sceneMix : 1;

        // Ambient light drift (brand dark hues slowly shift)
        const ph = (t * 0.05) % 1;
        const tr = Math.round(29 + Math.sin(ph * Math.PI * 2) * 6);
        const tg = Math.round(31 + Math.sin(ph * Math.PI * 2 + 1.2) * 6);
        const tb = Math.round(39 + Math.cos(ph * Math.PI * 2) * 9);
        const paGrad = ctx.createLinearGradient(pa.x, pa.y, pa.x, pa.y + pa.h);
        paGrad.addColorStop(0, `rgb(${tr}, ${tg}, ${tb})`);
        paGrad.addColorStop(1, '#2A2D3A');
        ctx.fillStyle = paGrad;
        ctx.fillRect(pa.x, pa.y, pa.w, pa.h);

        // Scene-driven aurora glow (colors blend between previous & current stage)
        for (let ai = 0; ai < SC.auroras.length; ai++) {
            const ca = SC.auroras[ai], fa = (SPF.auroras && SPF.auroras[ai]) || ca;
            const hx = lerpColorHex(fa[0], ca[0], SM);
            const hy = lerpColorHex(fa[1], ca[1], SM);
            const cx = pa.x + pa.w * (0.5 + Math.sin(t * 0.13 + ai * 2.1) * ca[2]);
            const cy = pa.y + pa.h * (0.5 + Math.cos(t * 0.11 + ai * 1.7) * ca[3]);
            const rad = Math.max(pa.w, pa.h) * 0.72;
            const ag = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
            ag.addColorStop(0, `rgba(${hx}, 0.18)`);
            ag.addColorStop(0.5, `rgba(${hy}, 0.08)`);
            ag.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = ag;
            ctx.fillRect(pa.x, pa.y, pa.w, pa.h);
        }

        // Subtle grid lines (webpage texture) - brand teal tint
        ctx.strokeStyle = `rgba(${SC.grid}, 0.05)`;
        ctx.lineWidth = 1;
        const gridSize = 40;
        for (let x = pa.x; x <= pa.x + pa.w; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, pa.y);
            ctx.lineTo(x, pa.y + pa.h);
            ctx.stroke();
        }
        for (let y = pa.y; y <= pa.y + pa.h; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(pa.x, y);
            ctx.lineTo(pa.x + pa.w, y);
            ctx.stroke();
        }

        // Parallax drifting layer (ambient "web page" feel)
        if (!this._parallax) {
            this._parallax = [];
            const glyphs = '{}<>/;=+*#$%';
            for (let i = 0; i < 48; i++) {
                this._parallax.push({
                    x: Math.random(),
                    y: Math.random(),
                    r: 1 + Math.random() * 2.6,
                    spd: 4 + Math.random() * 18,
                    layer: Math.floor(Math.random() * 3),
                    sym: Math.random() < 0.42,
                    ch: glyphs.charAt(Math.floor(Math.random() * glyphs.length)),
                    hue: Math.random() < 0.5 ? '78,205,196' : '255,107,107'
                });
            }
        }
        const SYM = ['{', '}', '<', '>', '/', ';', '=', '+', '*'];
        for (const p of this._parallax) {
            const depth = 0.3 + p.layer * 0.35;
            const py = ((p.y + t * p.spd * 0.02) % 1) * pa.h + pa.y;
            const px = p.x * pa.w + pa.x + Math.sin((t + p.x * 10) * 0.2 + p.layer) * (10 * depth);
            const alpha = 0.04 + p.layer * 0.06;
            if (p.sym) {
                ctx.fillStyle = `rgba(${p.hue}, ${alpha})`;
                ctx.font = (10 + p.layer * 6) + 'px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.ch, px, py);
            } else {
                const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 3 * depth);
                g.addColorStop(0, `rgba(${p.hue}, ${alpha})`);
                g.addColorStop(1, `rgba(${p.hue}, 0)`);
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(px, py, p.r * 3 * depth, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Scene-specific motif overlay (fades in during transition)
        this.drawSceneMotif(ctx, pa, t, SC, SM);

        // Subtle vignette effect
        const vignette = ctx.createRadialGradient(
            pa.x + pa.w / 2, pa.y + pa.h / 2, 100,
            pa.x + pa.w / 2, pa.y + pa.h / 2, pa.w / 2
        );
        vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vignette.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
        ctx.fillStyle = vignette;
        ctx.fillRect(pa.x, pa.y, pa.w, pa.h);
    },

    // Distinct background motif per scene (nebula / ember / hex / grid / alert / zenith)
    drawSceneMotif(ctx, pa, t, sc, mix) {
        const W = pa.w, H = pa.h, ox = pa.x, oy = pa.y;
        ctx.save();
        if (sc.motif === 'ember') {
            ctx.globalAlpha = 0.5 * mix;
            for (let i = 0; i < 26; i++) {
                const px = ox + ((i * 53.7) % W);
                const py = oy + H - (((t * (20 + (i % 7) * 6)) + i * 30) % H);
                const r = 1.2 + (i % 4);
                const g = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
                g.addColorStop(0, `rgba(${sc.grid}, 0.9)`);
                g.addColorStop(1, `rgba(${sc.grid}, 0)`);
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(px, py, r * 4, 0, Math.PI * 2); ctx.fill();
            }
        } else if (sc.motif === 'hex') {
            ctx.globalAlpha = 0.10 * mix;
            ctx.strokeStyle = `rgba(${sc.grid}, 1)`;
            ctx.lineWidth = 1;
            const s = 46, dx = s * Math.sqrt(3), dy = s * 1.5;
            const off = (t * 8) % dy;
            for (let row = -1; row * dy < H + dy; row++) {
                for (let col = -1; col * dx < W + dx; col++) {
                    const hx = ox + col * dx + (row % 2 ? dx / 2 : 0);
                    const hy = oy + row * dy - off;
                    ctx.beginPath();
                    for (let k = 0; k < 6; k++) {
                        const a = Math.PI / 3 * k;
                        const x = hx + s * Math.cos(a), y = hy + s * Math.sin(a);
                        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.closePath(); ctx.stroke();
                }
            }
        } else if (sc.motif === 'grid') {
            ctx.globalAlpha = 0.12 * mix;
            ctx.strokeStyle = `rgba(${sc.grid}, 1)`;
            ctx.lineWidth = 1;
            const gs = 60, ox2 = (t * 14) % gs;
            for (let x = ox - gs; x <= ox + W; x += gs) {
                ctx.beginPath(); ctx.moveTo(x + ox2, oy); ctx.lineTo(x + ox2, oy + H); ctx.stroke();
            }
            for (let y = oy - gs; y <= oy + H; y += gs) {
                ctx.beginPath(); ctx.moveTo(ox, y - ox2); ctx.lineTo(ox + W, y - ox2); ctx.stroke();
            }
        } else if (sc.motif === 'alert') {
            ctx.globalAlpha = (0.06 + 0.05 * Math.abs(Math.sin(t * 2))) * mix;
            ctx.fillStyle = `rgba(${sc.grid}, 1)`;
            for (let y = oy; y < oy + H; y += 6) ctx.fillRect(ox, y, W, 2);
            const pr = (t * 60) % Math.max(W, H);
            ctx.globalAlpha = (0.25 * (1 - pr / Math.max(W, H))) * mix;
            ctx.strokeStyle = `rgba(${sc.grid}, 1)`;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(ox + W/2, oy + H/2, pr, 0, Math.PI*2); ctx.stroke();
        } else if (sc.motif === 'zenith') {
            ctx.globalAlpha = 0.18 * mix;
            ctx.save();
            ctx.translate(ox + W/2, oy + H/2);
            ctx.rotate(t * 0.05);
            for (let i = 0; i < 18; i++) {
                ctx.rotate(Math.PI * 2 / 18);
                const grd = ctx.createLinearGradient(0, 0, Math.max(W,H), 0);
                grd.addColorStop(0, `rgba(${sc.grid}, 0.0)`);
                grd.addColorStop(0.5, `rgba(${sc.grid}, 0.5)`);
                grd.addColorStop(1, `rgba(${sc.grid}, 0)`);
                ctx.fillStyle = grd;
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.max(W,H), -14); ctx.lineTo(Math.max(W,H), 14); ctx.closePath(); ctx.fill();
            }
            ctx.restore();
        } else {
            // nebula: twinkling stars
            ctx.globalAlpha = 0.5 * mix;
            for (let i = 0; i < 30; i++) {
                const sx = ox + ((i * 137.5 + Math.sin(t*0.3+i)*20) % W);
                const sy = oy + ((i * 91.3 + Math.cos(t*0.27+i)*15) % H);
                const tw = 0.5 + 0.5 * Math.sin(t * 1.5 + i);
                ctx.fillStyle = `rgba(255,255,255,${tw})`;
                ctx.beginPath(); ctx.arc(sx, sy, 1 + tw, 0, Math.PI*2); ctx.fill();
            }
        }
        ctx.restore();
    },

    // Rounded-rectangle path helper
    roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    },

    // Draw a clickable UI button (gradient + hover) and register it for hit-testing
    drawUIButton(id, label, x, y, w, h, action) {
        const ctx = this.ctx;
        const hover = Input.mouse.inside &&
            Input.mouse.x >= x && Input.mouse.x <= x + w &&
            Input.mouse.y >= y && Input.mouse.y <= y + h;
        const grad = ctx.createLinearGradient(x, y, x + w, y + h);
        if (hover) {
            grad.addColorStop(0, '#FF6B6B');
            grad.addColorStop(1, '#4ECDC4');
        } else {
            grad.addColorStop(0, '#3A3D4A');
            grad.addColorStop(1, '#2A2D3A');
        }
        ctx.fillStyle = grad;
        this.roundRect(ctx, x, y, w, h, 8);
        ctx.fill();
        ctx.strokeStyle = hover ? '#FFFFFF' : '#4ECDC4';
        ctx.lineWidth = 2;
        this.roundRect(ctx, x, y, w, h, 8);
        ctx.stroke();
        ctx.fillStyle = hover ? '#1D1F27' : '#FFFFFF';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + h / 2 + 1);
        Input.registerButton(id, x, y, w, h, action);
    },

    drawHUD() {
        const ctx = this.ctx;
        const pa = CONFIG.PLAY_AREA;

        // Score (top-left)
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(10, pa.y + 8, 140, 28);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${Game.score}`, 18, pa.y + 22);

        // High score below
        ctx.fillStyle = 'rgba(255, 184, 108, 0.8)';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.fillText(`HI: ${Game.highScore}`, 18, pa.y + 38);

        // Health bar (top-center)
        const hbW = 200;
        const hbH = 18;
        const hbX = (CONFIG.CANVAS_W - hbW) / 2;
        const hbY = pa.y + 10;

        // Bar background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(hbX - 2, hbY - 2, hbW + 4, hbH + 4);

        // Health fill
        const healthPct = Game.player.health / Game.player.maxHealth;
        const fillW = hbW * healthPct;

        // Gradient from red (low) to green (high)
        const r = Math.floor(255 * (1 - healthPct) + 78 * healthPct);
        const g = Math.floor(107 * (1 - healthPct) + 205 * healthPct);
        const b = Math.floor(107 * (1 - healthPct) + 196 * healthPct);
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fillRect(hbX, hbY, fillW, hbH);

        // Bar border
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(hbX, hbY, hbW, hbH);

        // Health text
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FRESHNESS', CONFIG.CANVAS_W / 2, hbY + hbH / 2 + 1);

        // Active power-up indicators
        let indicatorX = hbX;
        const indicatorY = hbY + hbH + 6;

        if (Game.player.shieldTimer > 0) {
            this.drawPowerupIndicator(indicatorX, indicatorY, 'httpsLock', Game.player.shieldTimer, CONFIG.POWERUPS.httpsLock.duration);
            indicatorX += 55;
        }
        if (Game.player.cloakTimer > 0) {
            this.drawPowerupIndicator(indicatorX, indicatorY, 'privateCloak', Game.player.cloakTimer, CONFIG.POWERUPS.privateCloak.duration);
            indicatorX += 55;
        }
        if (Game.player.slowTimer > 0) {
            this.drawPowerupIndicator(indicatorX, indicatorY, 'slow', Game.player.slowTimer, 0.3);
            indicatorX += 55;
        }

        // Dash cooldown indicator (right side of health bar)
        const dashX = hbX + hbW + 10;
        const dashY = hbY + hbH / 2;
        const dashReady = Game.player.dashCooldown <= 0;
        ctx.fillStyle = dashReady ? 'rgba(0, 255, 200, 0.3)' : 'rgba(100, 100, 100, 0.3)';
        ctx.beginPath();
        ctx.arc(dashX, dashY, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = dashReady ? '#00FFCC' : '#3D4452';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Cooldown arc
        if (!dashReady) {
            const cdPct = 1 - (Game.player.dashCooldown / CONFIG.PLAYER.dashCooldown);
            ctx.strokeStyle = '#00FFCC';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(dashX, dashY, 12, -Math.PI / 2, -Math.PI / 2 + cdPct * Math.PI * 2);
            ctx.stroke();
        }
        // DASH text
        ctx.fillStyle = dashReady ? '#00FFCC' : '#888888';
        ctx.font = 'bold 8px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('DASH', dashX, dashY + 1);

        // Weapon indicator (current name + switch slots + cooldown ring + banner)
        if (Game.player) {
            const wdef = CONFIG.WEAPONS[Game.player.weapon];

            // Current weapon name (top center)
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = wdef.color;
            ctx.font = 'bold 13px "Courier New", monospace';
            const wl = Game.player.weaponLevels[Game.player.weapon];
            ctx.fillText(wdef.name + (wl > 0 ? '  Lv.' + wl : ''), CONFIG.CANVAS_W / 2, 18);

            // Weapon slots row (top center)
            const slotW = 36, slotH = 18, gap = 6;
            const totalW = slotW * CONFIG.WEAPON_ORDER.length + gap * (CONFIG.WEAPON_ORDER.length - 1);
            let sx = (CONFIG.CANVAS_W - totalW) / 2;
            const sy = 30;
            for (let i = 0; i < CONFIG.WEAPON_ORDER.length; i++) {
                const wid = CONFIG.WEAPON_ORDER[i];
                const wd = CONFIG.WEAPONS[wid];
                const active = Game.player.weapon === wid;
                ctx.fillStyle = active ? hexToRgba(wd.color, 0.25) : 'rgba(255,255,255,0.06)';
                this.roundRect(ctx, sx, sy, slotW, slotH, 4);
                ctx.fill();
                ctx.strokeStyle = active ? wd.color : 'rgba(255,255,255,0.15)';
                ctx.lineWidth = active ? 2 : 1;
                this.roundRect(ctx, sx, sy, slotW, slotH, 4);
                ctx.stroke();
                ctx.fillStyle = active ? wd.color : 'rgba(255,255,255,0.4)';
                ctx.font = 'bold 9px "Courier New", monospace';
                ctx.fillText((i + 1) + ' ' + wd.name, sx + slotW / 2, sy + slotH / 2);
                sx += slotW + gap;
            }

            // Weapon switch banner
            if (Game.player.switchBanner > 0) {
                ctx.globalAlpha = Math.min(1, Game.player.switchBanner);
                ctx.fillStyle = wdef.color;
                ctx.font = 'bold 18px "Courier New", monospace';
                ctx.fillText('WEAPON: ' + wdef.name, CONFIG.CANVAS_W / 2, 62);
                ctx.globalAlpha = 1;
            }

            // Weapon upgrade banner
            if (Game.player.weaponUpBanner > 0) {
                ctx.globalAlpha = Math.min(1, Game.player.weaponUpBanner);
                ctx.fillStyle = '#FFD166';
                ctx.font = 'bold 16px "Courier New", monospace';
                const wl2 = Game.player.weaponLevels[Game.player.weapon];
                ctx.fillText('WEAPON UP!  ' + wdef.name + ' Lv.' + wl2, CONFIG.CANVAS_W / 2, 80);
                ctx.globalAlpha = 1;
            }

            // Cooldown ring (near dash indicator)
            const gunX = dashX + 30;
            const gunY = dashY;
            const gunReady = Game.player.fireCooldown <= 0;
            ctx.fillStyle = gunReady ? 'rgba(255, 107, 107, 0.3)' : 'rgba(100, 100, 100, 0.3)';
            ctx.beginPath();
            ctx.arc(gunX, gunY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = gunReady ? wdef.color : '#3D4452';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            if (!gunReady) {
                const cdPct = 1 - (Game.player.fireCooldown / wdef.cooldown);
                ctx.strokeStyle = wdef.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(gunX, gunY, 12, -Math.PI / 2, -Math.PI / 2 + cdPct * Math.PI * 2);
                ctx.stroke();
            }
            ctx.fillStyle = gunReady ? wdef.color : '#888888';
            ctx.font = 'bold 8px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GUN', gunX, gunY + 1);
            if (!Input.isTouch) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.font = 'bold 8px "Courier New", monospace';
                ctx.fillText('[J]', gunX, gunY + 22);
            }

            // Combo skill charge meter
            const cmX = CONFIG.CANVAS_W / 2 - 70;
            const cmY = 52;
            const cmW = 140, cmH = 6;
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            this.roundRect(ctx, cmX, cmY, cmW, cmH, 3); ctx.fill();
            const cmPct = Math.min(1, Game.player.combo / Game.player.comboMax);
            ctx.fillStyle = Game.player.skillReady ? '#FFD166' : '#4ECDC4';
            this.roundRect(ctx, cmX, cmY, cmW * cmPct, cmH, 3); ctx.fill();
            ctx.fillStyle = Game.player.skillReady ? '#FFD166' : 'rgba(255,255,255,0.4)';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Game.player.skillReady ? 'SKILL READY [K]' : 'COMBO ' + Game.player.combo + '/' + Game.player.comboMax, CONFIG.CANVAS_W / 2, cmY + cmH + 9);
        }
    },

    drawBossBar() {
        if (!Game.boss) return;
        const ctx = this.ctx;
        const bbW = 380;
        const bbH = 14;
        const bbX = (CONFIG.CANVAS_W - bbW) / 2;
        const bbY = CONFIG.CANVAS_H - 28;

        ctx.textBaseline = 'middle';

        // Background frame
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(bbX - 3, bbY - 3, bbW + 6, bbH + 6);

        // Health fill (brand gradient)
        const pct = Math.max(0, Game.boss.hp / Game.boss.maxHp);

    drawPowerupIndicator(x, y, type, remaining, max) {
        const ctx = this.ctx;
        const w = 50;
        const h = 16;

        // Background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(x, y, w, h);

        // Progress fill
        const pct = clamp(remaining / max, 0, 1);
        const color = type === 'httpsLock' ? '#4ECDC4' : 
                      type === 'privateCloak' ? '#A78BFA' : '#6C5CE7';
        ctx.fillStyle = color + '88';
        ctx.fillRect(x, y, w * pct, h);

        // Border
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, w, h);

        // Label
        const label = type === 'httpsLock' ? 'SHIELD' :
                      type === 'privateCloak' ? 'CLOAK' : 'SLOW';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 8px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    },

    drawClearEventUI() {
        const ctx = this.ctx;
        const pa = CONFIG.PLAY_AREA;

        const barW = 360;
        const barH = 24;
        const barX = (CONFIG.CANVAS_W - barW) / 2;
        const barY = pa.y + 55;

        // Warning background
        ctx.fillStyle = 'rgba(255, 107, 107, 0.15)';
        ctx.fillRect(barX - 10, barY - 18, barW + 20, barH + 24);

        // Warning text
        const blink = Math.sin(Date.now() / 100) > 0;
        ctx.fillStyle = blink ? '#FF6B6B' : '#FFB3B3';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚠ CLEARING BROWSING DATA ⚠', CONFIG.CANVAS_W / 2, barY - 8);

        // Bar background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

        // Progress fill (red gradient)
        const fillW = barW * Game.clearEventProgress;
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, '#FF6B6B');
        grad.addColorStop(0.5, '#FFB199');
        grad.addColorStop(1, '#FF6B6B');
        ctx.fillStyle = grad;
        ctx.fillRect(barX, barY, fillW, barH);

        // Pulsing overlay
        const pulse = Math.sin(Date.now() / 80) * 0.15 + 0.15;
        ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
        ctx.fillRect(barX, barY, fillW, barH);

        // Bar border
        ctx.strokeStyle = '#FF6B6B';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, barW, barH);

        // Percentage text
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`${Math.floor(Game.clearEventProgress * 100)}%`, CONFIG.CANVAS_W / 2, barY + barH / 2 + 1);
    },

    drawTouchControls() {
        const ctx = this.ctx;
        const pa = CONFIG.PLAY_AREA;

        // Only draw if touch is detected or always show subtle
        const showControls = Input.isTouch || true; // Always show, subtle when inactive
        if (!showControls) return;

        // === Virtual Joystick (bottom-left) ===
        const jx = 80;
        const jy = CONFIG.CANVAS_H - 80;
        const baseAlpha = Input.joystick.active ? 0.5 : 0.2;

        // Outer ring
        ctx.strokeStyle = `rgba(255, 255, 255, ${baseAlpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(jx, jy, Input.joystick.maxRadius, 0, Math.PI * 2);
        ctx.stroke();

        // Inner fill
        ctx.fillStyle = `rgba(255, 255, 255, ${baseAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(jx, jy, Input.joystick.maxRadius, 0, Math.PI * 2);
        ctx.fill();

        // Joystick knob
        let knobX = jx;
        let knobY = jy;
        if (Input.joystick.active) {
            knobX = jx + Input.joystick.dx;
            knobY = jy + Input.joystick.dy;
        }
        ctx.fillStyle = Input.joystick.active ? 'rgba(255, 107, 107, 0.8)' : 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(knobX, knobY, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(78, 205, 196, 0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // === Dash Button (bottom-right) ===
        const dx = CONFIG.CANVAS_W - 80;
        const dy = CONFIG.CANVAS_H - 80;
        const dashReady = Game.player && Game.player.dashCooldown <= 0;
        const dashAlpha = Input.dashBtn.touchId !== null ? 0.6 : 0.25;

        ctx.fillStyle = dashReady ? `rgba(0, 255, 200, ${dashAlpha * 0.3})` : `rgba(100, 100, 100, ${dashAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(dx, dy, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = dashReady ? `rgba(0, 255, 200, ${dashAlpha})` : `rgba(150, 150, 150, ${dashAlpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();

        // DASH label
        ctx.fillStyle = dashReady ? `rgba(0, 255, 200, ${dashAlpha + 0.3})` : `rgba(150, 150, 150, ${dashAlpha + 0.3})`;
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('DASH', dx, dy);

        // Space key hint (if no touch detected)
        if (!Input.isTouch) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillText('[SPACE]', dx, dy + 20);
        }

        // === Fire Button (bottom-right, left of dash) ===
        const fx = CONFIG.CANVAS_W - 160;
        const fy = CONFIG.CANVAS_H - 80;
        const gunReady = Game.player && Game.player.fireCooldown <= 0;
        const fireAlpha = Input.fireBtn.touchId !== null ? 0.6 : 0.25;
        ctx.fillStyle = gunReady ? `rgba(255, 107, 107, ${fireAlpha * 0.3})` : `rgba(100, 100, 100, ${fireAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(fx, fy, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = gunReady ? `rgba(255, 107, 107, ${fireAlpha})` : `rgba(150, 150, 150, ${fireAlpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = gunReady ? `rgba(255, 107, 107, ${fireAlpha + 0.3})` : `rgba(150, 150, 150, ${fireAlpha + 0.3})`;
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FIRE', fx, fy);
        if (!Input.isTouch) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillText('[J]', fx, fy + 20);
        }

        // === Switch Weapon Button (bottom-right, left of fire) ===
        const swx = CONFIG.CANVAS_W - 240;
        const swy = CONFIG.CANVAS_H - 80;
        const swAlpha = Input.switchBtn.touchId !== null ? 0.6 : 0.25;
        const curW = Game.player ? CONFIG.WEAPONS[Game.player.weapon] : null;
        ctx.fillStyle = `rgba(167, 139, 250, ${swAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(swx, swy, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(167, 139, 250, ${swAlpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = `rgba(167, 139, 250, ${swAlpha + 0.3})`;
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SWITCH', swx, swy - 4);
        ctx.font = 'bold 9px "Courier New", monospace';
        const wl3 = Game.player ? Game.player.weaponLevels[Game.player.weapon] : 0;
        ctx.fillText(curW ? curW.name + (wl3 > 0 ? ' L' + wl3 : '') : '', swx, swy + 9);
        if (!Input.isTouch) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillText('[Q]', swx, swy + 20);
        }

        // === Skill Button (bottom-right, left of switch) ===
        const skx = CONFIG.CANVAS_W - 320;
        const sky = CONFIG.CANVAS_H - 80;
        const skReady = Game.player && Game.player.skillReady;
        const skAlpha = Input.skillBtn.touchId !== null ? 0.6 : 0.25;
        ctx.fillStyle = skReady ? `rgba(255, 209, 102, ${skAlpha * 0.4})` : `rgba(100, 100, 100, ${skAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(skx, sky, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = skReady ? `rgba(255, 209, 102, ${skAlpha + 0.3})` : `rgba(150, 150, 150, ${skAlpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = skReady ? `rgba(255, 209, 102, ${skAlpha + 0.3})` : `rgba(150, 150, 150, ${skAlpha + 0.3})`;
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SKILL', skx, sky - 2);
        ctx.font = 'bold 8px "Courier New", monospace';
        ctx.fillText(skReady ? 'READY' : 'CHARGE', skx, sky + 10);
        if (!Input.isTouch) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillText('[K]', skx, sky + 22);
        }
    },

        const blink = Math.sin(Date.now() / 400) > 0;
        ctx.fillStyle = blink ? '#4ECDC4' : '#8A93A8';
        ctx.fillText('or press ENTER / tap anywhere', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 185);

        // High score
        if (Game.highScore > 0) {
            ctx.fillStyle = '#FFB86C';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillText(`High Score: ${Game.highScore}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 205);
        }
    },

    drawDecorativeCookie(x, y) {
        const ctx = this.ctx;
        const s = 30;
        const bounce = Math.sin(Date.now() / 300) * 4;
        const drawY = y + bounce;

        // Glow (brand teal)
        const glow = ctx.createRadialGradient(x, drawY, 0, x, drawY, s * 1.5);
        glow.addColorStop(0, 'rgba(78, 205, 196, 0.3)');
        glow.addColorStop(1, 'rgba(78, 205, 196, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, drawY, s * 1.5, 0, Math.PI * 2);
        ctx.fill();

        // Body (brand pink -> teal gradient)
        const decoGrad = ctx.createLinearGradient(x, drawY - s, x, drawY + s);
        decoGrad.addColorStop(0, '#FF6B6B');
        decoGrad.addColorStop(1, '#4ECDC4');
        ctx.fillStyle = decoGrad;
        ctx.beginPath();
        ctx.arc(x, drawY, s, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2A2030';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Chips
        ctx.fillStyle = '#2A2030';
        const chips = [
            { cx: -8, cy: -6, cs: 5 },
            { cx: 7, cy: -8, cs: 5 },
            { cx: 9, cy: 5, cs: 4 },
            { cx: -5, cy: 7, cs: 4 },
            { cx: 0, cy: 0, cs: 4 },
        ];
        for (const c of chips) {
            ctx.fillRect(x + c.cx - c.cs / 2, drawY + c.cy - c.cs / 2, c.cs, c.cs);
        }

        // Eyes
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x - 9, drawY - 5, 5, 5);
        ctx.fillRect(x + 4, drawY - 5, 5, 5);
        ctx.fillStyle = '#000000';
        ctx.fillRect(x - 7, drawY - 3, 2, 2);
        ctx.fillRect(x + 6, drawY - 3, 2, 2);

        // Smile
        ctx.strokeStyle = '#2A2030';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, drawY + 5, 5, 0.3, Math.PI - 0.3);
        ctx.stroke();
    },

    drawGameOverScreen() {
        const ctx = this.ctx;

        // Dark overlay
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Title
        ctx.fillStyle = '#FF6B6B';
        ctx.font = 'bold 36px "Courier New", monospace';
        ctx.fillText('GAME OVER', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 - 70);

        // Cookie crumbs (decorative)
        ctx.fillStyle = '#2A2030';
        ctx.font = '20px "Courier New", monospace';
        const crumbY = CONFIG.CANVAS_H / 2 - 40;
        ctx.fillText('• • •', CONFIG.CANVAS_W / 2, crumbY);

        // Score
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText(`Score: ${Game.score}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2);

        // High score
        const isNewHigh = Game.score === Game.highScore && Game.score > 0;
        if (isNewHigh) {
            ctx.fillStyle = '#FFB86C';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillText('★ NEW HIGH SCORE! ★', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 25);
        } else {
            ctx.fillStyle = '#B8C0CC';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillText(`High Score: ${Game.highScore}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 25);
        }

        // Stats
        ctx.fillStyle = '#888888';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.fillText(`Survived: ${Math.floor(Game.time)}s  |  Kills: ${Game.kills}  |  Boss: ${Game.bossKills}  |  Power-ups: ${Game.powerupsCollected}`, CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 50);

        // TRY AGAIN button (real, clickable)
        this.drawUIButton('restart', 'TRY AGAIN', CONFIG.CANVAS_W / 2 - 100, CONFIG.CANVAS_H / 2 + 75, 200, 46, 'restart');

        // Hint
        const blink = Math.sin(Date.now() / 400) > 0;
        ctx.fillStyle = blink ? '#4ECDC4' : '#8A93A8';
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillText('or press ENTER', CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2 + 140);
    },
};

// ===== CANVAS RESIZE (Responsive 16:9) =====
function resizeCanvas() {
    const canvas = Renderer.canvas;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const aspectRatio = CONFIG.CANVAS_W / CONFIG.CANVAS_H;

    let canvasW, canvasH;
    if (w / h > aspectRatio) {
        // Window is wider than aspect ratio - fit to height
        canvasH = h;
        canvasW = h * aspectRatio;
    } else {
        // Window is taller than aspect ratio - fit to width
        canvasW = w;
        canvasH = w / aspectRatio;
    }

    canvas.style.width = canvasW + 'px';
    canvas.style.height = canvasH + 'px';

    // Ensure pixelated rendering after resize
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
}

// ===== GAME LOOP =====
let lastTime = 0;
let accumulatedTime = 0;

function gameLoop(timestamp) {
    // Calculate delta time (capped to prevent huge jumps)
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    // Cap delta time to 1/30 second to prevent physics issues
    if (dt > 1 / 30) dt = 1 / 30;
    if (isNaN(dt)) dt = 0;

    // Handle confirm input (start/restart)
    if (Input.consumeConfirm()) {
        if (Game.state === 'start' || Game.state === 'gameover') {
            Game.startGame();
        }
    }

    // Update game state
    if (Game.state === 'playing') {
        Game.update(dt);
    } else if (Game.state === 'gameover') {
        // Continue updating particles for visual effect
        for (let i = Game.particles.length - 1; i >= 0; i--) {
            Game.particles[i].update(dt);
            if (Game.particles[i].isDead) {
                Game.particles.splice(i, 1);
            }
        }
        // Decay screen effects
        if (Game.shakeAmount > 0) {
            Game.shakeAmount *= 0.88;
            if (Game.shakeAmount < 0.1) Game.shakeAmount = 0;
        }
        if (Game.flashAlpha > 0) {
            Game.flashAlpha -= dt * 2;
            if (Game.flashAlpha < 0) Game.flashAlpha = 0;
        }
    }

    // Clear per-frame UI button registry (re-registered during render)
    Input.uiButtons.length = 0;

    // Render
    Renderer.render();

    requestAnimationFrame(gameLoop);
}

// ===== INITIALIZATION =====
function init() {
    const canvas = document.getElementById('gameCanvas');

    // Initialize renderer
    Renderer.init(canvas);

    // Initialize input system
    Input.init(canvas);

    // Initialize game
    Game.init();

    // Handle window resize
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Prevent context menu on right-click (for better game experience)
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // Start game loop
    requestAnimationFrame(gameLoop);
}

// Start when page loads
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

</script>
