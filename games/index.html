<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏中心 · 小待</title>
<style>
  :root{
    --bg:#0f1311; --card:#181d1a; --card2:#1f2622; --line:#2a322d;
    --txt:#e8efe9; --sub:#9fb0a6; --primary:#34d399;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden;background:
    radial-gradient(1200px 600px at 80% -10%, rgba(52,211,153,.10), transparent 60%),
    radial-gradient(900px 500px at 0% 0%, rgba(176,31,36,.08), transparent 55%),
    var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100dvh;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--sub);font-size:14px;transition:transform .15s,border-color .15s,color .15s;touch-action:manipulation}
  .back:hover{border-color:var(--primary);color:var(--txt)}
  .back:active{transform:scale(.96)}
  .back svg{width:16px;height:16px}
  h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
  h1 svg{width:26px;height:26px}
  .sub{color:var(--sub);font-size:13.5px;margin:4px 0 22px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .g{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:16px;padding:18px 16px 16px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;touch-action:manipulation}
  .g:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.35);border-color:var(--ac)}
  .g:active{transform:translateY(-1px)}
  .g .bar{position:absolute;top:0;left:0;right:0;height:4px;background:var(--ac)}
  .ic{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--ac) 18%, transparent);margin-bottom:12px}
  .ic svg{width:30px;height:30px}
  .g h3{margin:0 0 6px;font-size:17px;font-weight:700}
  .g p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.55;min-height:38px}
  .play{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ac)}
  .play svg{width:15px;height:15px;transition:transform .15s}
  .g:hover .play svg{transform:translateX(3px)}
  footer{margin-top:30px;text-align:center;color:var(--sub);font-size:12px}
  @media (hover:none){.g:hover{transform:none;box-shadow:none}.g:active{transform:scale(.99)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      返回指挥台
    </a>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4"/><circle cx="15" cy="10" r="1"/><circle cx="18" cy="14" r="1"/></svg>
      游戏中心
    </h1>
  </header>
  <p class="sub">摸鱼补给站 · 4 款自研小游戏，随时开一局</p>

  <div class="grid" id="grid"></div>

  <footer>小待的工作台 · 游戏中心 &nbsp;|&nbsp; 全屏游玩，按浏览器返回回到指挥台</footer>
</div>

<script>
  var GAMES = [
    { file:'shadow-hunter.html', title:'暗影猎手', note:'3D 第三人称动作，操控角色在场景中战斗与探索。',
      ac:'#a78bfa',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M12 8v4M10 10h4"/></svg>' },
    { file:'cookies-last-stand.html', title:"Cookie's Last Stand", note:'canvas 防御射击，守住你的饼干不被抢光。',
      ac:'#fbbf24',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="#fbbf24"/><circle cx="15" cy="14" r="1" fill="#fbbf24"/><circle cx="14" cy="8" r="1" fill="#fbbf24"/><circle cx="8" cy="15" r="1" fill="#fbbf24"/></svg>' },
    { file:'fireboy-watergirl.html', title:'森林冰火人', note:'经典双人协作过关，火娃与水娃配合闯关。',
      ac:'#38bdf8',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"><path d="M12 3c2 3 4 4 4 7a4 4 0 0 1-8 0c0-3 2-4 4-7z"/><path d="M5 14c1.5 2 2.5 3 2.5 5a2.5 2.5 0 0 1-5 0c0-2 1-3 2.5-5z"/><path d="M19 14c1.5 2 2.5 3 2.5 5a2.5 2.5 0 0 1-5 0c0-2 1-3 2.5-5z"/></svg>' },
    { file:'gold-miner.html', title:'黄金矿工', note:'经典钩爪采矿，限时抓取金块与钻石赚分。',
      ac:'#f59e0b',
      icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"><path d="M12 3v9"/><path d="M12 12l-5 5a3 3 0 0 0 5 0l0 0"/><circle cx="12" cy="8" r="2.5"/></svg>' }
  ];
  var arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';
  var grid = document.getElementById('grid');
  GAMES.forEach(function(g){
    var el = document.createElement('a');
    el.className = 'g';
    el.href = g.file;
    el.style.setProperty('--ac', g.ac);
    el.innerHTML =
      '<div class="bar"></div>' +
      '<div class="ic">'+g.icon+'</div>' +
      '<h3>'+g.title+'</h3>' +
      '<p>'+g.note+'</p>' +
      '<span class="play">开始游戏 '+arrow+'</span>';
    grid.appendChild(el);
  });
</script>
</body>
</html>
