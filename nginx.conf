# =====================================================================
# 静态站 Nginx 配置 —— 镜像瘦身后的对应服务端优化
# 加载：Dockerfile 里 COPY 到 /etc/nginx/conf.d/default.conf
# =====================================================================
server {
    listen       80;
    server_name  _;

    # 关闭版本号泄露；开启压缩减小下载量
    server_tokens off;
    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # 静态站的理想缓存：带 hash 的资源长缓存；入口页 no-cache
    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 / 跳到主站，与本地 serve.py 行为对齐
    location = / {
        return 302 $scheme://$http_host/_master/;
    }
}