<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>空间思维训练 · 立方块计数</title>
<style>
  :root{
    --bg:#0f1311; --panel:#181d1a; --ink:#e8efe9; --muted:#8b9b93; --line:#262d29;
    --primary:#34d399; --primary-soft:#14352b; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer;font-weight:700;text-decoration:none}
  .back:hover{border-color:var(--primary)}
  .title{font-size:14px;font-weight:800;opacity:.9}
  .spacer{flex:1}
  .hint{font-size:12px;color:var(--muted)}
  .frame{flex:1;min-height:0;background:#000}
  .frame iframe{width:100%;height:100%;border:0;display:block}
  @media(max-width:600px){
    .bar{padding:8px 10px}
    .back{padding:7px 10px;font-size:12px}
    .title{font-size:13px}
    .hint{display:none}
  }
</style>
<script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head>
<body>
  <div class="bar">
    <a class="back" href="../index.html" target="_top">← 返回指挥台</a>
    <div class="title">🧊 空间思维训练 · 立方块计数</div>
    <div class="spacer"></div>
    <div class="hint">基于 cube-01 开源项目</div>
  </div>
  <div class="frame">
    <iframe src="../../spatial-games/cube-01/index.html" title="cube-01 游戏" allow="autoplay; fullscreen"></iframe>
  </div>
</body>
</html>
