<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D 沉浸式云游 · 城市漫游</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050a18">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --sky:#050a18; --ink:#e7eef6; --dim:#9db2cc; --line:rgba(103,158,209,.35);
  --accent:#22d3ee; --card:rgba(10,18,38,.82); --card-line:rgba(96,165,250,.35);
  --good:#3dd68c; --danger:#ff5c7a;
}
html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;}
#app{position:fixed;inset:0}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#view.drag{cursor:grabbing}

/* ===== 顶栏 ===== */
#topbar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:linear-gradient(180deg,rgba(4,9,24,.66),rgba(4,9,24,0));
  pointer-events:none}
#brand{font-size:15px;font-weight:700;letter-spacing:.02em;pointer-events:auto;display:flex;align-items:center;gap:8px}
#backlink{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(10,18,38,.62);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px);transition:.18s}
#backlink:hover{border-color:var(--accent);color:#fff}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
#citybar{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;margin-left:auto;justify-content:flex-end}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(10,18,38,.55);
  color:var(--dim);font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;backdrop-filter:blur(6px);white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--accent)}
.chip.on{color:#06212e;background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px rgba(34,211,238,.5)}

/* ===== 右上工具 ===== */
#tools{position:absolute;top:64px;right:14px;z-index:10;display:flex;gap:8px;flex-direction:column;pointer-events:auto}
.tbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(10,18,38,.6);
  color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s;backdrop-filter:blur(6px)}
.tbtn:hover{color:#fff;border-color:var(--accent);transform:translateY(-1px)}
.tbtn svg{width:19px;height:19px}

/* ===== POI 侧栏 ===== */
#poi{position:absolute;left:14px;top:64px;z-index:10;width:210px;pointer-events:auto}
#poi h4{font-size:11px;letter-spacing:.14em;color:var(--dim);margin:0 4px 8px;font-weight:700}
.poiitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:4px;
  border:1px solid transparent;cursor:pointer;transition:.18s;background:transparent}
.poiitem:hover{background:rgba(34,211,238,.08);border-color:var(--card-line)}
.poiitem.on{background:rgba(34,211,238,.12);border-color:var(--accent)}
.poiitem .pdot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.poiitem .pnm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 提示条 ===== */
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:10;
  padding:8px 16px;border-radius:999px;font-size:12px;color:var(--dim);background:rgba(10,18,38,.55);
  border:1px solid var(--line);backdrop-filter:blur(6px);white-space:nowrap;pointer-events:none}

/* ===== 开场覆盖 ===== */
#intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 0%,#0a1c33,#050a18 70%);flex-direction:column;text-align:center}
#intro.hide{opacity:0;pointer-events:none;transition:opacity .9s ease .2s}
#intro .t1{font-size:13px;letter-spacing:.34em;color:var(--accent);margin-bottom:14px;font-weight:600}
#intro .t2{font-size:44px;font-weight:800;letter-spacing:.04em;text-shadow:0 6px 40px rgba(34,211,238,.35)}
#intro .t3{margin-top:12px;font-size:13px;color:var(--dim);letter-spacing:.05em}
#intro .play{margin-top:28px;padding:12px 30px;border-radius:999px;border:none;cursor:pointer;
  background:var(--accent);color:#06212e;font-weight:700;font-size:14px;letter-spacing:.1em;
  box-shadow:0 0 24px rgba(34,211,238,.5);transition:.2s}
#intro .play:hover{transform:translateY(-2px);box-shadow:0 0 34px rgba(34,211,238,.7)}
#intro .skip{margin-top:12px;padding:8px 14px;background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer}

/* ===== 地标信息卡 ===== */
#info{position:absolute;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(64px + env(safe-area-inset-bottom));z-index:12;
  width:min(560px,92vw);background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:16px 18px;
  box-shadow:0 18px 60px rgba(0,0,0,.5);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:.28s}
#info.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#info .ih{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#info .ih .idot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 10px currentColor}
#info .ih .inm{font-size:18px;font-weight:800;letter-spacing:.01em}
#info .ih .iclose{margin-left:auto;width:28px;height:28px;border-radius:8px;border:none;background:rgba(255,255,255,.08);color:var(--dim);cursor:pointer;font-size:16px}
#info .icn{font-size:13px;color:#cfdcee;line-height:1.7;margin-bottom:12px}
#info .shops b{display:block;font-size:12px;color:var(--accent);letter-spacing:.12em;margin-bottom:8px}
#info .shop{display:flex;align-items:center;gap:8px;font-size:13px;color:#e4ecf8;padding:7px 0;border-top:1px dashed rgba(96,165,250,.2)}
#info .shop .sd{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
#info .shop .st{color:var(--dim);font-size:12px;margin-left:auto;flex:none}
#info .shop .ds{color:#7fe9bd;font-size:12px;flex:none;margin-left:10px}

/* 移动端适配 */
@media (max-width:600px){
  #brand span.txt{display:none}
  #citybar{gap:5px}
  .chip{padding:5px 10px;font-size:11.5px}
  #poi{width:150px;left:10px;top:62px}
  #tools{right:10px;top:62px}
  #intro .t2{font-size:34px}
  #hint{font-size:11px;padding:7px 12px}
}
</style>

</div>

/* ---------- 3D 世界构建 ---------- */
function box(x,y0,z,w,d,h,c){return {type:'box',x:x,y0:y0,z:z,w:w,d:d,h:h,c:c};}
function sphere(x,y,z,r,c){return {type:'sphere',x:x,y:y,z:z,r:r,c:c};}

var world={boxes:[],land:[],anchor:[]};
function rebuild(city){
  world.boxes=[]; world.land=[]; world.anchor=[];
  var c=city;
  // 地标
  var i,r;
  for(i=0;i<c.landmarks.length;i++){
    var L=c.landmarks[i];
    var segs=L.shape();
    for(r=0;r<segs.length;r++){
      var s=segs[r];
      if(s.type==='box'){
        world.boxes.push({cx:L.x+s.x,cy:s.y0+s.h/2,cz:L.z+s.z,w:s.w,h:s.h,d:s.d,c:s.c});
      }else{
        world.land.push({type:'sphere',cx:L.x+s.x,cy:s.y,cz:L.z+s.z,r:s.r,c:s.c});
      }
    }
    world.anchor.push({x:L.x,z:L.z,y:L.anchor,name:L.name,c:L.c,land:L});
  }
  // 天际线建筑
  var R=rng(c.seed);
  var placed=[]; var n=0, guard=0;
  while(n<110 && guard<4000){
    guard++;
    var ang=R()*Math.PI*2, rad=80+Math.sqrt(R())*330;
    var x=Math.cos(ang)*rad, z=Math.sin(ang)*rad;
    // 避让地标
    var ok=true;
    for(i=0;i<world.anchor.length;i++){var a=world.anchor[i];var d2=(a.x-x)*(a.x-x)+(a.z-z)*(a.z-z);if(d2<60*60){ok=false;break;}}
    if(!ok)continue;
    for(i=0;i<placed.length;i++){var p=placed[i];var d2=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);if(d2<34*34){ok=false;break;}}
    if(!ok)continue;
    var wdt=16+R()*26, dep=wdt*(0.8+R()*0.5), hgt=26+R()*R()*150;
    world.boxes.push({cx:x,cy:hgt/2,cz:z,w:wdt,h:hgt,d:dep,c:pick(pal.bld,R)});
    placed.push({x:x,z:z}); n++;
  }

}

/* ---------- 相机 ---------- */
var cam={yaw:0.9,pitch:0.52,dist:880,tx:0,tz:0};
var defYaw={sh:0.9,bj:1.1,sz:1.0,cd:1.2,hz:1.0,gz:1.1};
var defPitch=0.5, defDist=900;

function viewBasis(){
  // 相机位置（绕目标点 orbit，pitch 抬高俯视）
  var camX=cam.tx+ (cam.dist*Math.cos(cam.pitch)*Math.sin(cam.yaw));
  var camY=         cam.dist*Math.sin(cam.pitch);
  var camZ=cam.tz+ (cam.dist*Math.cos(cam.pitch)*Math.cos(cam.yaw));
  // 前向（看向目标）
  var fx=cam.tx-camX, fy=0-camY, fz=cam.tz-camZ;
  var fl=Math.sqrt(fx*fx+fy*fy+fz*fz);fx/=fl;fy/=fl;fz/=fl;
  // 右向 = f × up(0,1,0) = (-fz, 0, fx)
  var rx=-fz, ry=0, rz=fx;
  var rl=Math.sqrt(rx*rx+rz*rz)||1; rx/=rl; rz/=rl;
  // 上向 u = r × f
  var ux=ry*fz-rz*fy, uy=rz*fx-rx*fz, uz=rx*fy-ry*fx;
  return {pos:{x:camX,y:camY,z:camZ}, r:{x:rx,y:ry,z:rz}, u:{x:ux,y:uy,z:uz}, f:{x:fx,y:fy,z:fz}};
}
function proj(p,vb){
  var dx=p.x-vb.pos.x, dy=p.y-vb.pos.y, dz=p.z-vb.pos.z;
  var cz=dx*vb.f.x+dy*vb.f.y+dz*vb.f.z;
  if(cz<1)return null;
  var cxx=dx*vb.r.x+dy*vb.r.y+dz*vb.r.z;
  var cyy=dx*vb.u.x+dy*vb.u.y+dz*vb.u.z;
  return {x:cx+cxx*f/cz, y:cy0-cyy*f/cz, z:cz};
}

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}

function fogMix(hex,z,base){

  }

  // 地标标记（2D overlay）
  drawMarkers(vb);
}

/* ---------- 标记与命中 ---------- */
var markers=[];
function drawMarkers(vb){
  markers=[];
  for(var i=0;i<world.anchor.length;i++){
    var a=world.anchor[i];
    var p=proj({x:a.x,y:a.y,z:a.z},vb);
    if(!p)continue;
    markers.push({x:p.x,y:p.y,name:a.name,c:a.c,land:a.land,z:p.z});
    var rad=7+Math.sin(time*0.006+i*1.7)*2;
    ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.283);
    ctx.fillStyle=a.c;ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,rad+4,0,6.283);
    ctx.strokeStyle=a.c;ctx.globalAlpha=0.35;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1;
    ctx.font='600 12px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(10,18,38,.75)';
    var tw=ctx.measureText(a.name).width+16;
    var bx=p.x+16, by=p.y-10;
    if(bx+tw>W)bx=p.x-16-tw;
    ctx.fillStyle='rgba(10,18,38,.7)';ctx.beginPath();rrect(bx,by,tw,20,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(a.name,bx+8,by+10);
  }
}

/* ---------- 时间与动画 ---------- */
var time=0;var raf;
function rrect(x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function loop(){
  time=performance.now();
  try{render();}catch(err){
    var box=document.getElementById('renderError');
    if(!box){box=document.createElement('pre');box.id='renderError';box.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;margin:0;padding:12px;border:1px solid #ff5c7a;border-radius:10px;background:#2a0d18;color:#ffd8df;font:12px/1.5 monospace;white-space:pre-wrap';document.body.appendChild(box);}
    box.textContent='渲染错误：'+(err.stack||err.message||err);
    return;
  }
  raf=requestAnimationFrame(loop);
}

/* ---------- 交互：轨道 ---------- */
var pointers=new Map();var dragStart=null;var moved=false;var pinch=null;
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=false;dragStart={x:e.clientX,y:e.clientY};
  cv.classList.add('drag');
});
cv.addEventListener('pointermove',function(e){
  if(!pointers.has(e.pointerId))return;
  var prev=pointers.get(e.pointerId);
  var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(Math.abs(e.clientX-dragStart.x)+Math.abs(e.clientY-dragStart.y)>5)moved=true;
  if(pointers.size===1){
    cam.yaw+=dx*0.006; cam.pitch=Math.max(0.05,Math.min(1.25,cam.pitch+dy*0.004));
  }else if(pointers.size===2){
    var pts=Array.from(pointers.values());
    var d0=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    var pd=pinch?pinch.d:Math.max(100,d0);
    pinch={d:d0};
    if(d0>0)cam.dist=Math.max(200,Math.min(1800,cam.dist*(pd/d0)));
  }
});
function endPtr(e){
  if(!pointers.has(e.pointerId))return;
  pointers.delete(e.pointerId);pinch=null;
  cv.classList.remove('drag');
  if(pointers.size===0&&!moved){hitTest(e.clientX,e.clientY);}
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',function(e){e.preventDefault();cam.dist=Math.max(200,Math.min(1800,cam.dist+e.deltaY*0.6));},{passive:false});

/* ---------- 命中检测 ---------- */
function hitTest(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<markers.length;i++){var m=markers[i];var d=Math.hypot(m.x-x,m.y-y);if(d<24&&d<bd){bd=d;best=m;}}
  if(best){showInfo(best);focusLandmark(best);}
  else closeInfo();
}

/* ---------- 地标聚焦 ---------- */
function focusLandmark(m){
  var lx=m.x,mz=m.z;
  var ty=m.land.anchor;
  // 目标 yaw：让相机从东南方向看向地标
  var target={tx:lx,tz:mz,yaw:0.15,pitch:0.42,dist:Math.max(420,m.land.name.length*30)};
  animateCam(target,900);
  highlightPOI(m.name);
}
function animateCam(target,dur){
  var from={yaw:cam.yaw,pitch:cam.pitch,dist:cam.dist,tx:cam.tx,tz:cam.tz};
  var t0=time;
  function step(){
    var t=Math.min(1,(time-t0)/dur);var e=t*t*(3-2*t);
    cam.yaw=from.yaw+(target.yaw-from.yaw)*e;
    cam.pitch=from.pitch+(target.pitch-from.pitch)*e;
    cam.dist=from.dist+(target.dist-from.dist)*e;
    cam.tx=from.tx+(target.tx-from.tx)*e;
    cam.tz=from.tz+(target.tz-from.tz)*e;
    if(t<1)requestAnimationFrame(step);
  }
  step();
}

/* ---------- 信息卡 ---------- */
var infoEl=document.getElementById('info');
function showInfo(m){
  document.getElementById('infoName').textContent=m.name;
  document.getElementById('infoDesc').textContent=m.land.intro;
  document.getElementById('infoDot').style.color=m.c;
  var sh=document.getElementById('infoShops');sh.innerHTML='';
  m.land.shops.forEach(function(s){
    var d=document.createElement('div');d.className='shop';
    d.innerHTML='<span class="sd"></span><span>'+s.n+'</span><span class="st">'+s.t+'</span><span class="ds">'+s.d+'</span>';
    sh.appendChild(d);
  });
  infoEl.classList.add('show');
}
function closeInfo(){infoEl.classList.remove('show');unhighlightPOI();}
document.getElementById('infoClose').onclick=closeInfo;
function highlightPOI(name){Array.prototype.forEach.call(document.querySelectorAll('.poiitem'),function(el){el.classList.toggle('on',el.dataset.n===name);});}
function unhighlightPOI(){Array.prototype.forEach.call(document.querySelectorAll('.poiitem'),function(el){el.classList.remove('on');});}

/* ---------- POI 侧栏 ---------- */
function renderPOI(c){
  var box=document.getElementById('poiList');box.innerHTML='';
  c.landmarks.forEach(function(L){
    var d=document.createElement('div');d.className='poiitem';d.dataset.n=L.name;
    d.innerHTML='<span class="pdot" style="color:'+L.c+'"></span><span class="pnm">'+L.name+'</span>';
    d.onclick=function(){var m={x:L.x,z:L.z,land:L,name:L.name,c:L.c,y:L.anchor};focusLandmark(m);};
    box.appendChild(d);
  });
}

/* ---------- 开场 ---------- */
var introDone=false;
function playIntro(c){
  introDone=true;
  var overlay=document.getElementById('intro');
  document.getElementById('introName').textContent='云游'+c.name;
  document.getElementById('introSub').textContent='电影级运镜 · '+c.tag;
  overlay.classList.remove('hide');
  // 重设为高空视角
  cam.yaw=defYaw[c.id]+Math.PI*2.4; cam.pitch=1.0; cam.dist=1500; cam.tx=0; cam.tz=0;
  var t0=time;var dur=2600;
  function step(){
    var t=Math.min(1,(time-t0)/dur);var e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    cam.yaw=defYaw[c.id]+Math.PI*2.4+(defYaw[c.id]-defYaw[c.id]-Math.PI*2.4)*e;
    cam.pitch=1.0+(defPitch-1.0)*e;
    cam.dist=1500+(defDist-1500)*e;
    cam.tx=0;cam.tz=0;
    if(t<1)requestAnimationFrame(step);else {overlay.classList.add('hide');}
  }
  step();
  setTimeout(function(){overlay.classList.add('hide');},dur+600);
}
function enterCity(e){
  if(e){e.preventDefault();e.stopPropagation();}
  introDone=true;
  var overlay=document.getElementById('intro');
  overlay.classList.add('hide');
  overlay.style.pointerEvents='none';
  overlay.setAttribute('aria-hidden','true');
}
var introPlay=document.getElementById('introPlay');
var introSkip=document.getElementById('introSkip');
introPlay.addEventListener('click',enterCity);
introPlay.addEventListener('pointerup',enterCity);
introSkip.addEventListener('click',enterCity);
introSkip.addEventListener('pointerup',enterCity);
document.getElementById('btnReplay').onclick=function(){var c=CITIES[state.city];playIntro(c);};

/* ---------- 昼夜 ---------- */
document.getElementById('btnTheme').onclick=function(){
  mode=(mode==='night')?'day':'night';pal=PAL[mode];
  rebuild(CITIES[state.city]);
};

/* ---------- 城市切换 ---------- */
var state={city:0};
function renderCitybar(){
  var bar=document.getElementById('citybar');bar.innerHTML='';
  CITIES.forEach(function(c,i){
    var b=document.createElement('button');b.className='chip'+(i===state.city?' on':'');
    b.textContent=c.name;b.onclick=function(){if(i===state.city)return;state.city=i;switchCity();};
    bar.appendChild(b);
  });
}
function switchCity(){
  var c=CITIES[state.city];
  rebuild(c);renderPOI(c);closeInfo();
  cam.tx=0;cam.tz=0;cam.yaw=defYaw[c.id];cam.pitch=defPitch;cam.dist=defDist;
  playIntro(c);
}

/* ---------- 启动 ---------- */
renderCitybar();
rebuild(CITIES[0]);
renderPOI(CITIES[0]);
loop();
playIntro(CITIES[0]);
})();
</script>
</body>
