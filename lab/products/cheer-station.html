<script>
/* 主题跟随主站（同 anime.html 模式）：读 wb_store.data.theme（老版 wb_hub_theme），auto 跟随系统 */
(function(){
  function stored(){
    try{
      var raw=localStorage.getItem('wb_store');
      if(raw){var o=JSON.parse(raw); if(o&&o.data&&o.data.theme) return o.data.theme;}
    }catch(e){}
    try{ var l=localStorage.getItem('wb_hub_theme'); if(l) return l; }catch(e){}
    return 'auto';
  }
  function mq(){ return window.matchMedia('(prefers-color-scheme: dark)'); }
  function apply(m){
    var dark=mq().matches;
    var act=(m==='dark'||m==='light')?m:(dark?'dark':'light');
    document.documentElement.setAttribute('data-theme',act);
  }
  apply(stored());
  window.addEventListener('storage',function(e){
    if(e.key==='wb_store'||e.key==='wb_hub_theme') apply(stored());
  });
  try{ mq().addEventListener('change',function(){ if(stored()==='auto') apply('auto'); }); }catch(e){}
})();
</script>

var S={days:[],whys:[],count:0};

function mode(){return document.body.getAttribute('data-mode')}

function streak(){
  if(!S.days.length)return 0;
  var set={};S.days.forEach(function(d){set[d]=1});
  function fmt(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
  var n=0,cur=new Date();
  /* 今天打了先 +1，然后从昨天起向回走（原实现把今天在 while 里又数了一遍） */
  if(set[fmt(cur)])n++;
  cur.setDate(cur.getDate()-1);
  while(set[fmt(cur)]){n++;cur.setDate(cur.getDate()-1)}
  return n;
}

}
function confetti(el){
  var colors=['#5b8cff','#ff9f43','#f472b6','#34d399','#fbd38d'];
  for(var i=0;i<14;i++){
    var c=document.createElement('i');c.className='confetti';
    c.style.left=(6+Math.random()*88)+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*.25)+'s';
    el.appendChild(c);
    (function(node){setTimeout(function(){node.remove()},1800)})(c);
  }
}
$('#pumpBtn').addEventListener('click',function(){
  var p=pool(),pick=p[Math.floor(Math.random()*p.length)];
  var b=$('#bubble');
  $('#bubbleBody').innerHTML='<span class="bic">'+pick.i+'</span><div class="bq">'+esc(pick.q)+'</div>';
  $('#bubbleMeta').textContent='—— 打气站'+(mode()==='study'?'学习频道':'生活频道');
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
  confetti(b);
  var t=today();
  if(S.days.indexOf(t)<0){S.days.push(t)}
  S.count++;save();renderStats();
  renderPumpHint();
});
function renderPumpHint(){
  var t=today(),hit=S.days.indexOf(t)>=0;
  $('#pumpHint').textContent=hit?'✅ 今天已打气，电量满格（想再充也随时欢迎）':'今天还没打气，点上面那颗 ⚡';
}
/* 我的为什么 */
function renderWhys(){
  var hero=$('#whyHero');
  if(!S.whys.length){hero.textContent='还没有写下「为什么」。第一次来，先写一条吧——它会陪你走过最想放弃的那天。'}
  else{hero.textContent='「 '+S.whys[Math.floor(Math.random()*S.whys.length)]+' 」'}
  var box=$('#whyList');box.innerHTML='';
  S.whys.forEach(function(w,i){
    var row=document.createElement('div');row.className='row';
    row.innerHTML='<div class="grow">'+esc(w)+'</div>';
    var del=document.createElement('button');del.className='btn del';del.textContent='删';
    del.onclick=function(){S.whys.splice(i,1);save();renderWhys();renderStats()};
    row.appendChild(del);box.appendChild(row);
  });
}
$('#whyAdd').onclick=function(){
  var v=$('#whyIpt').value.trim();
  if(!v){toast('先写下你的理由');return}
  if(S.whys.length>=20){toast('最多 20 条，删掉再写新的');return}
  S.whys.push(v);$('#whyIpt').value='';save();renderWhys();renderStats();toast('已记下，它会随机出现在最上面');
};
/* 急救包 */
initKit();
function initKit(){
  var kitBtns=document.querySelectorAll('.kbtn');
  Array.prototype.forEach.call(kitBtns,function(b){
    b.onclick=function(){
      var k=KITS[b.getAttribute('data-kit')];
      var out=$('#kout');
      out.innerHTML='<b><span>'+k.i+'</span>'+esc(k.t)+'</b><p>'+esc(k.p)+'</p><div class="act">'+k.a+'</div>';
      out.classList.remove('show');void out.offsetWidth;out.classList.add('show');
    };
  });
}
/* 标语墙 */
function renderWall(){
  var box=$('#wall');box.innerHTML='';
  pool().forEach(function(x){var d=document.createElement('div');d.className='wq';d.textContent=x.q;box.appendChild(d)});
}
/* 模式切换 */
$('#mStudy').onclick=function(){setMode('study')};
$('#mLife').onclick=function(){setMode('life')};
function setMode(m){
  document.body.setAttribute('data-mode',m);
  $('#mStudy').className='mode'+(m==='study'?' on-study':'');
  $('#mLife').className='mode'+(m==='life'?' on-life':'');
  $('#pumpLabel').textContent=m==='study'?'给我打气':'抱抱我';
  renderWall();
  try{localStorage.setItem(KEY+'_mode',m)}catch(e){}
}
try{var m0=localStorage.getItem(KEY+'_mode');if(m0==='life')setMode('life')}catch(e){}

renderStats();renderWhys();renderPumpHint();renderWall();

function reportH(){
  var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
  try{parent.postMessage({__wbResize:true,id:'cheerFrame',h:h},'*')}catch(e){}
}
if(window.ResizeObserver){new ResizeObserver(reportH).observe(document.body)}
window.addEventListener('load',reportH);
setTimeout(reportH,400);
})();
</script>
</body>
</html>
