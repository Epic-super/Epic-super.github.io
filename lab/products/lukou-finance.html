<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<title>路口理财 · 资产与财富工作台</title>
<style>
:root{
  --bg:#f6f3ee; --panel:#ffffff; --panel2:#fbf9f5; --ink:#2a2724; --muted:#948b80;
  --line:#e8e2d8; --line2:#f0ece4; --clay:#b8863a; --clay-soft:#f6ecd9; --clay-ink:#8f6526;
  --sage:#7c9082; --sage-soft:#e9efe9; --gold:#c9a24b; --red:#cf5b4e; --green:#3f9e6f;
  --indigo:#c9a24b; --indigo-soft:#f6efdf;
  --pos:#3f9e6f; --neg:#cf5b4e;
  --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 20px rgba(40,30,20,.05);
  --radius:18px; --radius-s:12px;
  --serif:"Songti SC","STSong",Georgia,"Times New Roman",serif;
}
[data-theme="dark"]{
  --bg:#161310; --panel:#1e1b17; --panel2:#211d18; --ink:#ece6dd; --muted:#9a9186;
  --line:#2d2823; --line2:#262019; --clay:#d8b25e; --clay-soft:#322a18; --clay-ink:#e3c77c;
  --sage:#90a597; --sage-soft:#1f2a23; --gold:#d8b25e; --red:#e07a6e; --green:#5bb98c;
  --indigo:#d8b25e; --indigo-soft:#2a2415;
  --pos:#5bb98c; --neg:#e07a6e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
::-webkit-scrollbar{height:0;width:0;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:212px;flex:none;position:sticky;top:0;height:100vh;padding:22px 13px;border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;}
.brand .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--clay));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.brand .logo svg{width:19px;height:19px;}
.brand b{font-family:var(--serif);font-size:16px;letter-spacing:.5px;}
.brand small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;transition:.15s;border:1px solid transparent;}
.nav-item svg{width:18px;height:18px;flex:none;}
.nav-item:hover{background:var(--panel);color:var(--ink);}
.nav-item.active{background:var(--clay-soft);color:var(--clay-ink);border-color:var(--line);}
.nav-item .badge{margin-left:auto;background:var(--clay);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700;}
.side-foot{margin-top:auto;padding:10px 8px 0;color:var(--muted);font-size:11px;line-height:1.6;}
.side-foot button{background:none;border:none;color:var(--clay-ink);cursor:pointer;font-size:11px;padding:0;text-decoration:underline;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);padding:15px 22px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;}
.topbar h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:.5px;}
.topbar .date{color:var(--muted);font-size:12px;margin-left:2px;}
.topbar .spacer{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{border-color:var(--clay);}
.wrap{max-width:940px;width:100%;margin:0 auto;padding:20px 22px 120px;}
.view-head{display:flex;align-items:baseline;gap:10px;margin:0 0 16px;flex-wrap:wrap;}
.view-head h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;}
.view-head .desc{color:var(--muted);font-size:13px;}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.panel.tight{padding:14px;}
.panel-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;gap:10px;flex-wrap:wrap;}
.panel-title h3{font-size:15px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;}
.panel-title h3 svg{width:17px;height:17px;color:var(--clay);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px;}
.field label{font-size:12px;color:var(--muted);font-weight:600;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:.15s;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--clay);background:var(--panel);}
textarea{resize:vertical;min-height:38px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;}
.btn svg{width:17px;height:17px;}
.btn:hover{border-color:var(--clay);}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn.primary:hover{background:var(--clay-ink);}
.btn.ghost{background:transparent;}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px;}
.btn.danger{color:var(--red);}
.btn.danger:hover{border-color:var(--red);background:var(--panel2);}
.btn.block{width:100%;}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--clay);color:var(--ink);}
.chip.on{background:var(--clay);border-color:var(--clay);color:#fff;}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.stat .n{font-family:var(--serif);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.stat .n.pos{color:var(--pos);} .stat .n.neg{color:var(--neg);}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;}
.acct{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:10px;}
.acct .dot{width:12px;height:12px;border-radius:50%;flex:none;}
.acct .meta{flex:1;min-width:0;}
.acct .meta b{font-size:15px;}
.acct .meta small{color:var(--muted);font-size:12px;display:block;}
.acct .amt{text-align:right;font-variant-numeric:tabular-nums;}
.acct .amt b{font-size:16px;}
.acct .amt small{display:block;font-size:12px;}
.acct .del{color:var(--muted);cursor:pointer;font-size:13px;}
.acct .del:hover{color:var(--red);}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:12.5px;color:var(--muted);}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
.goal{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:12px;}
.goal .ring{width:62px;height:62px;flex:none;}
.goal .meta{flex:1;min-width:0;}
.goal .meta b{font-size:15px;}
.goal .bar{flex:1;height:8px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:6px;}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--clay));}
.banner{background:var(--clay);color:#fff;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13.5px;}
.banner button{background:#fff;color:var(--clay-ink);border:none;border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer;}
.banner .x{margin-left:auto;cursor:pointer;opacity:.85;font-size:18px;}
.q{margin-bottom:16px;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);}
.q p{margin:0 0 10px;font-weight:600;font-size:14px;}
.q label{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;font-size:13.5px;transition:.15s;}
.q label:hover{border-color:var(--clay);}
.q input{width:auto;flex:none;}
.q label.sel{background:var(--clay-soft);border-color:var(--clay);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:.25s;width:200px;}.sidebar.open{transform:translateX(0);}.menu-btn{display:flex!important;}.grid2,.grid3,.grid4{grid-template-columns:1fr;}.wrap{padding:16px 14px 100px;}}
.menu-btn{display:none;}
</style>
<script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
      <div><b>路口理财</b><small>资产与财富工作台</small></div>
    </div>
    <div class="nav-item active" onclick="go('overview')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg><span>资产总览</span></div>
    <div class="nav-item" onclick="go('sip')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 16l4-5 4 3 4-6"/></svg><span>定投计算</span></div>
    <div class="nav-item" onclick="go('goal')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg><span>理财目标</span></div>
    <div class="nav-item" onclick="go('flow')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>交易流水</span></div>
    <div class="nav-item" onclick="go('risk')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>风险测评</span></div>
    <div class="nav-item" onclick="go('data')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l4-4m-4 4l-4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg><span>数据</span></div>
    <div class="side-foot"><button onclick="toggleTheme()">切换深浅色</button><br>WorkBuddy · 本地优先</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="viewTitle">资产总览</h1>
      <span class="date" id="topDate"></span>
      <span class="spacer"></span>
      <button class="icon-btn" onclick="toggleTheme()" title="深浅色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg></button>
    </div>
    <div class="wrap" id="app"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
<script>
"use strict";
window.addEventListener('error',function(e){try{var v=document.getElementById('app')||document.getElementById('view')||document.body;if(!v||v.dataset.err)return;v.dataset.err='1';var s=(e.error&&e.error.stack)||e.message||'';var b=document.createElement('div');b.style.cssText='padding:16px;margin:14px;font-family:ui-monospace,monospace;font-size:13px;color:#a33;background:#fdeceb;border:1px solid #f5c6cb;border-radius:12px;line-height:1.5';b.innerHTML='<b>⚠ 页面出错了</b><br><span style="color:#555">'+(e.message||'')+'</span><pre style="white-space:pre-wrap;margin-top:8px;font-size:11px">'+(s||'').slice(0,1000)+'</pre><small style="color:#666">建议 Ctrl+Shift+R 强刷；F12 → Application → Local Storage 清本页缓存后刷新。</small>';v.insertBefore(b,v.firstChild);}catch(_){}});const KEY='lukoufin_v1', BAK=KEY+'_bak';
const CATS={cash:{label:'现金',color:'#c9a24b'},deposit:{label:'存款',color:'#7c9082'},fund:{label:'基金',color:'#3a5a8c'},stock:{label:'股票',color:'#c2683f'},bond:{label:'债券',color:'#9c6f4e'},ins:{label:'保险',color:'#8b6fa3'},house:{label:'房产',color:'#5a8c8c'},other:{label:'其他',color:'#948b80'}};
const RISK_Q=[
  {q:'您的投资期限大致是？',o:[['1 年内',1],['1-3 年',2],['3-5 年',3],['5 年以上',4]]},
  {q:'若投资市值一个月跌去 20%，您会？',o:[['全部赎回',1],['赎回一半',2],['继续持有',3],['趁低加仓',4]]},
  {q:'您的年龄区间？',o:[['60 岁以上',1],['45-60',2],['30-45',3],['30 以下',4]]},
  {q:'您的收入稳定性？',o:[['不稳定',1],['一般',2],['较稳定',3],['非常稳定',4]]},
  {q:'可投资资产占家庭净资产比例？',o:[['>70%',1],['50-70%',2],['30-50%',3],['<30%',4]]},
  {q:'您期望的年化收益？',o:[['3% 以内稳健',1],['3-6%',2],['6-10%',3],['10% 以上可承受波动',4]]},
  {q:'过往投资经验？',o:[['无',1],['存款/货基',2],['基金/理财',3],['股票/衍生品',4]]},
  {q:'投资首要目标？',o:[['保本',1],['抗通胀',2],['稳健增值',3],['高成长',4]]}
];
let DB=null, corrupted=false, UI={tab:'overview'};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function $(s){return document.querySelector(s);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function fmt(n){n=Number(n)||0;const s=(n<0?'-':'')+Math.abs(n).toLocaleString('zh-CN',{maximumFractionDigits:2});return s;}
function fmtPct(n){n=Number(n)||0;return (n>=0?'+':'')+n.toFixed(1)+'%';}

function seed(){
  const accounts=[
    {id:uid(),name:'活期+货基',cat:'cash',amount:86000,cost:86000},
    {id:uid(),name:'定期存款',cat:'deposit',amount:200000,cost:200000},
    {id:uid(),name:'沪深300指数基金',cat:'fund',amount:138000,cost:120000},
    {id:uid(),name:'某蓝筹股',cat:'stock',amount:52000,cost:60000},
    {id:uid(),name:'重疾险现金价值',cat:'ins',amount:34000,cost:40000},
    {id:uid(),name:'自住房产估值',cat:'house',amount:3200000,cost:2800000}
  ];
  const goals=[
    {id:uid(),name:'应急储备金',target:200000,current:120000,deadline:'2026-12-31'},
    {id:uid(),name:'三年后购车',target:300000,current:86000,deadline:'2028-08-01'}
  ];
  const flows=[
    {id:uid(),date:today(),cat:'fund',type:'买入',amount:5000,note:'定投标的'},
    {id:uid(),date:today(),cat:'stock',type:'分红',amount:1200,note:'年度分红'}
  ];
  return {accounts,goals,flows,risk:{answers:[],done:false,score:0,level:'',advice:''},plans:[],meta:{updatedAt:Date.now(),lastBackupAt:0,unbacked:0},demo:true};
}
function normalize(d){
  d.accounts=d.accounts||[];d.goals=d.goals||[];d.flows=d.flows||[];d.plans=d.plans||[];
  d.risk=d.risk||{answers:[],done:false,score:0,level:'',advice:''};
  d.meta=d.meta||{updatedAt:Date.now(),lastBackupAt:0,unbacked:0};d.demo=!!d.demo;
  return d;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw){DB=seed();save(true);return;}DB=normalize(JSON.parse(raw));}
  catch(e){corrupted=true;const bak=localStorage.getItem(BAK);if(bak){try{DB=normalize(JSON.parse(bak));}catch(_){DB=seed();}}else DB=seed();setTimeout(()=>showCorrupt(),60);}
}
function save(silent){if(corrupted)return;try{localStorage.setItem(BAK,JSON.stringify(DB));localStorage.setItem(KEY,JSON.stringify(DB));if(!silent){DB.meta.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(DB));}}catch(e){showStorageError(e);}}
function showStorageError(e){toast('存储失败：'+(e&&e.name==='QuotaExceededError'?'空间已满':'浏览器限制/隐私模式')+'，请用「数据」页导出备份');}
function showCorrupt(){const app=$('#app');if(app)app.innerHTML=`<div class="banner" style="background:var(--red)">⚠️ 本地数据损坏，已尝试自动备份恢复；仍有问题可到「数据」页下载原始文件或清空重置。<span class="x" onclick="go('data')">→</span></div>`+app.innerHTML;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function toggleTheme(){const r=document.documentElement;r.setAttribute('data-theme',r.getAttribute('data-theme')==='dark'?'light':'dark');try{localStorage.setItem('lukoufin_theme',r.getAttribute('data-theme'));}catch(e){}}

/* compute */
function netWorth(){return DB.accounts.reduce((a,x)=>a+(Number(x.amount)||0),0);}
function totalCost(){return DB.accounts.reduce((a,x)=>a+(Number(x.cost)||0),0);}
function profit(){return netWorth()-totalCost();}
function profitPct(){const c=totalCost();return c>0?profit()/c*100:0;}
function catData(){const m={};DB.accounts.forEach(a=>{m[a.cat]=(m[a.cat]||0)+(Number(a.amount)||0);});return Object.keys(m).map(k=>({label:CATS[k].label,value:m[k],color:CATS[k].color}));}

/* svg */
function donut(data){
  const total=data.reduce((a,b)=>a+b.value,0)||1;
  const R=54,C=2*Math.PI*R;let off=0;
  const segs=data.map(d=>{const len=d.value/total*C;const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg viewBox="0 0 140 140" width="150" height="150">${segs}<text x="70" y="64" text-anchor="middle" font-size="12" fill="var(--muted)">总净值</text><text x="70" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${fmt(total)}</text></svg>`;
}
function areaChart(series){ // series:[value...]
  const W=620,H=200,pad=28;const max=Math.max(...series,1),min=Math.min(...series,0);
  const n=series.length;const x=i=>pad+i/(n-1)*(W-2*pad);const y=v=>H-pad-(v-min)/(max-min||1)*(H-2*pad);
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=`${pad},${H-pad} ${pts} ${W-pad},${H-pad}`;
  const grid=[0.25,0.5,0.75].map(g=>`<line x1="${pad}" y1="${pad+g*(H-2*pad)}" x2="${W-pad}" y2="${pad+g*(H-2*pad)}" stroke="var(--line2)" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto">
    ${grid}
    <polygon points="${area}" fill="var(--clay-soft)" opacity=".7"/>
    <polyline points="${pts}" fill="none" stroke="var(--clay)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(series[n-1])}" r="4" fill="var(--clay)"/>
  </svg>`;
}
function ring(pct,size,color){pct=Math.max(0,Math.min(100,pct));const R=size/2-7,C=2*Math.PI*R;return `<svg class="ring" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line2)" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color||'var(--clay)'}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(pct/100*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="${size/2}" y="${size/2+5}" text-anchor="middle" font-size="${size/7}" font-weight="700" fill="var(--ink)">${pct.toFixed(0)}%</text></svg>`;}

/* actions */
function addAccount(){const name=$('#accName').value.trim();const cat=$('#accCat').value;const amount=parseFloat($('#accAmount').value);const cost=parseFloat($('#accCost').value)||amount;if(!name||isNaN(amount)){toast('请填写名称与金额');return;}$('#accName').value='';$('#accAmount').value='';$('#accCost').value='';DB.accounts.push({id:uid(),name,cat,amount,cost});DB.meta.unbacked=(DB.meta.unbacked||0)+1;save();renderOverview();toast('已添加账户');}
function delAccount(id){DB.accounts=DB.accounts.filter(a=>a.id!==id);save();renderOverview();}
function calcSip(){const P=parseFloat($('#sipP').value)||0;const rate=parseFloat($('#sipR').value)||0;const months=parseInt($('#sipM').value)||0;if(P<=0||months<=0){toast('请填写月投金额与期数');return;}const r=rate/100/12;const series=[];let bal=0;for(let i=1;i<=months;i++){bal=bal*(1+r)+P;if(i===1||i===months||i%Math.max(1,Math.round(months/48))===0)series.push(bal);}series.push(bal);const invested=P*months;const fv=bal;UI._sip={P,rate,months,fv,invested,gain:fv-invested,series};renderSip();}
function saveSip(){if(!UI._sip){toast('请先计算');return;}DB.plans.push({id:uid(),...UI._sip});DB.meta.unbacked=(DB.meta.unbacked||0)+1;save();renderSip();toast('已保存定投方案');}
function delPlan(id){DB.plans=DB.plans.filter(p=>p.id!==id);save();renderSip();}
function addGoal(){const name=$('#goalName').value.trim();const target=parseFloat($('#goalTarget').value);const current=parseFloat($('#goalCur').value)||0;const deadline=$('#goalDue').value;if(!name||isNaN(target)){toast('请填写名称与目标金额');return;}$('#goalName').value='';$('#goalTarget').value='';$('#goalCur').value='';$('#goalDue').value='';DB.goals.push({id:uid(),name,target,current,deadline});DB.meta.unbacked=(DB.meta.unbacked||0)+1;save();renderGoal();toast('已添加目标');}
function delGoal(id){DB.goals=DB.goals.filter(g=>g.id!==id);save();renderGoal();}
function addFlow(){const date=$('#flowDate').value||today();const cat=$('#flowCat').value;const type=$('#flowType').value;const amount=parseFloat($('#flowAmt').value);const note=$('#flowNote').value.trim();if(isNaN(amount)){toast('请填写金额');return;}$('#flowAmt').value='';$('#flowNote').value='';DB.flows.unshift({id:uid(),date,cat,type,amount,note});DB.meta.unbacked=(DB.meta.unbacked||0)+1;save();renderFlow();toast('已记录流水');}
function delFlow(id){DB.flows=DB.flows.filter(f=>f.id!==id);save();renderFlow();}
function ansRisk(qi,score){DB.risk.answers[qi]=score;const qs=document.querySelectorAll('.q label');qs.forEach(l=>l.classList.remove('sel'));event&&event.target&&event.target.closest('label')&&event.target.closest('label').classList.add('sel');renderRisk();}
function submitRisk(){if(DB.risk.answers.length<RISK_Q.length||DB.risk.answers.includes(undefined)){toast('请答完所有题目');return;}const score=DB.risk.answers.reduce((a,b)=>a+b,0);let level,advice;if(score<=12){level='保守型';advice='以存款、货币基金、短债为主，配置比例建议：固收≥80%。';}else if(score<=20){level='稳健型';advice='以固收+宽基指数为主，少量权益，建议固收 60-70%。';}else if(score<=28){level='平衡型';advice='股债均衡，权益 40-50%，可配置指数基金与优质个股。';}else if(score<=32){level='进取型';advice='以权益为主，可加大股票/成长基金，权益 60-75%。';}else{level='激进型';advice='高仓位权益与另类，承受高波动博取高收益，权益≥80%。';}DB.risk={answers:[...DB.risk.answers],done:true,score,level,advice};save();renderRisk();toast('测评完成：'+level);}
function clearDemo(){
  const n=(DB.accounts.filter(a=>a.demo).length)+(DB.goals.filter(g=>g.demo).length)+(DB.flows.filter(f=>f.demo).length);
  DB.accounts=DB.accounts.filter(a=>!a.demo);DB.goals=DB.goals.filter(g=>!g.demo);DB.flows=DB.flows.filter(f=>!f.demo);DB.plans=DB.plans.filter(p=>!p.demo);DB.demo=false;save();
  if(UI.tab==='overview')renderOverview();if(UI.tab==='goal')renderGoal();if(UI.tab==='flow')renderFlow();
  toast('已清空演示数据');
}

/* export */
function exportJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});dl(blob,'路口理财_备份_'+today()+'.json');DB.meta.lastBackupAt=Date.now();DB.meta.unbacked=0;save(true);toast('已导出 JSON 备份');}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=normalize(JSON.parse(r.result));d.demo=false;DB=normalize({accounts:DB.accounts.concat(d.accounts),goals:DB.goals.concat(d.goals),flows:DB.flows.concat(d.flows),plans:DB.plans.concat(d.plans),risk:DB.risk,meta:DB.meta});save();renderView();toast('已导入合并');}catch(e){toast('导入失败：格式错误');}ev.target.value='';};r.readAsText(f);}
function wipeAll(){if(!confirm('确定清空全部数据？不可撤销。'))return;DB={accounts:[],goals:[],flows:[],plans:[],risk:{answers:[],done:false,score:0,level:'',advice:''},meta:{updatedAt:Date.now(),lastBackupAt:0,unbacked:0},demo:false};save();UI.tab='overview';renderView();toast('已清空');}

/* render */
const TABS=[{k:'overview',n:'资产总览'},{k:'sip',n:'定投计算'},{k:'goal',n:'理财目标'},{k:'flow',n:'交易流水'},{k:'risk',n:'风险测评'},{k:'data',n:'数据'}];
function go(t){UI.tab=t;$('#viewTitle').textContent=TABS.find(x=>x.k===t).n;renderView();window.scrollTo(0,0);document.getElementById('sidebar').classList.remove('open');}
function renderView(){render[UI.tab]();}

      </div>
    </div>
  </div>
  <div class="panel"><div class="panel-title"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>账户明细</h3><span class="hint">${DB.accounts.length} 个账户</span></div>
    ${DB.accounts.map(a=>{const p=Number(a.amount)-Number(a.cost);const pc=a.cost>0?p/a.cost*100:0;return `<div class="acct">

    <div class="row" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:14px">
      <input id="accName" class="field" placeholder="账户名（如 活期+货基）">
      <select id="accCat" class="field" style="max-width:130px">${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].label}</option>`).join('')}</select>
      <input id="accAmount" class="field" style="max-width:140px" type="number" placeholder="当前市值">
      <input id="accCost" class="field" style="max-width:140px" type="number" placeholder="成本（默认=市值）">
      <button class="btn primary" onclick="addAccount()">添加</button>
    </div>
  </div>`;
}
function renderSip(){
  const p=UI._sip;
  $('#app').innerHTML=`
  <div class="view-head"><h2>定投复利计算</h2><span class="desc">月投 + 年化收益 → 未来终值</span></div>
  <div class="panel"><div class="panel-title"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 16l4-5 4 3 4-6"/></svg>参数</h3></div>
    <div class="row">
      <div class="field"><label>每月定投（元）</label><input id="sipP" type="number" value="2000"></div>
      <div class="field"><label>预期年化（%）</label><input id="sipR" type="number" value="7" step="0.5"></div>
      <div class="field"><label>定投期数（月）</label><input id="sipM" type="number" value="120"></div>
      <button class="btn primary" onclick="calcSip()">计算</button>
      <button class="btn" onclick="saveSip()">保存方案</button>

    <div class="stat"><div class="n pos">${fmt(p.gain)}</div><div class="l">累计收益</div></div>
  </div>
  <div class="panel"><div class="panel-title"><h3>资产增长曲线</h3><span class="hint">${p.months} 个月 · 年化 ${p.rate}%</span></div>${areaChart(p.series)}</div>`:'<div class="hint">填写参数后点击「计算」查看增长曲线。</div>'}
  <div class="panel"><div class="panel-title"><h3>已保存方案</h3></div>
    ${DB.plans.length?DB.plans.map(pl=>`<div class="acct"><div class="meta"><b>月投 ${fmt(pl.P)} · ${pl.months} 月 · 年化 ${pl.rate}%</b><small>期末 ${fmt(pl.fv)} · 收益 ${fmt(pl.gain)}</small></div><span class="del" onclick="delPlan('${pl.id}')">删除</span></div>`).join(''):'<div class="hint">暂无方案</div>'}
  </div>`;
}
function renderGoal(){
  $('#app').innerHTML=`
  <div class="view-head"><h2>理财目标</h2><span class="desc">追踪每个目标的距离</span></div>
  ${DB.goals.map(g=>{const pct=Math.max(0,Math.min(100,g.current/g.target*100));return `<div class="goal">
    ${ring(pct,62)}
    <div class="meta"><b>${esc(g.name)}</b><small>已积累 ${fmt(g.current)} / 目标 ${fmt(g.target)} · ${g.deadline||'未设期限'}</small>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <span class="del" onclick="delGoal('${g.id}')">删除</span>
  </div>`;}).join('')||'<div class="warn">还没有目标，添加一个吧。</div>'}
  <div class="panel"><div class="panel-title"><h3>添加目标</h3></div>
    <div class="row">
      <input id="goalName" class="field" placeholder="目标名（如 应急储备金）">
      <input id="goalTarget" class="field" type="number" placeholder="目标金额" style="max-width:150px">
      <input id="goalCur" class="field" type="number" placeholder="已积累" style="max-width:140px">
      <input id="goalDue" class="field" type="date" style="max-width:160px">
      <button class="btn primary" onclick="addGoal()">添加</button>
    </div>
  </div>`;
}
function renderFlow(){
  const byCat={};DB.flows.forEach(f=>{byCat[f.cat]=(byCat[f.cat]||0)+((f.type==='赎回'||f.type==='卖出')?-Number(f.amount):Number(f.amount));});
  $('#app').innerHTML=`
  <div class="view-head"><h2>交易流水</h2><span class="desc">${DB.flows.length} 笔记录</span></div>

      <select id="flowType" class="field" style="max-width:110px"><option>买入</option><option>卖出</option><option>分红</option><option>存入</option><option>赎回</option><option>缴费</option></select>

  </div>`;
}
function renderRisk(){
  if(DB.risk.done){
    $('#app').innerHTML=`
    <div class="view-head"><h2>风险测评</h2><span class="desc">已完成</span></div>

  <div class="panel">
    ${RISK_Q.map((q,qi)=>`<div class="q"><p>${qi+1}. ${esc(q.q)}</p>${q.o.map((o,oi)=>`<label class="${DB.risk.answers[qi]===o[1]?'sel':''}" onclick="ansRisk(${qi},${o[1]})"><input type="radio" name="rq${qi}" ${DB.risk.answers[qi]===o[1]?'checked':''}> ${esc(o[0])}</label>`).join('')}</div>`).join('')}

}
