<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Token 数据驾驶舱</title><style>body{margin:0;background:#0f1115;color:#e6e8ec;font:14px system-ui,"Microsoft YaHei";padding:24px}main{max-width:900px;margin:auto}.box{background:#171a21;border:1px solid #2a2f3a;border-radius:14px;padding:22px;margin:14px 0}h1{margin:0 0 6px}p,li{color:#9aa3b2}.btn{display:inline-block;background:#4ecdc4;color:#111;padding:10px 16px;border-radius:9px;text-decoration:none;font-weight:700}.code{font-family:monospace;background:#1f232c;padding:10px;border-radius:8px;color:#4ecdc4}iframe{width:100%;height:800px;border:0;border-radius:12px;display:none}</style><script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head><body><main><h1>Token 数据驾驶舱</h1><p>本账号本地采集 · 多平台聚合 · 数据不上传</p><section id="gate" class="box"><h2>本地统计服务未启动</h2><p>请先启动 Token Dashboard 本地服务：</p><div class="code"><本地路径><br>或 python server.py --port 8780</div><p>支持 API 用量 JSON / CSV 导入、平台排行、模型排行、日均 Token、缓存命中率和费用统计。</p></section><iframe id="app" title="Token 数据驾驶舱"></iframe></main><script>fetch('http://127.0.0.1:8780/api/health').then(r=>r.json()).then(x=>{if(x.ok){document.getElementById('gate').style.display='none';const f=document.getElementById('app');f.src='http://127.0.0.1:8780/';f.style.display='block'}}).catch(()=>{});</script></body></html>
