"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<title>图纸列表清洗 · 真实Schema</title>\n<style>\n  :root{ --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --mut:#8b949e; --acc:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }\n  *{box-sizing:border-box}\n  body{background:var(--bg);color:var(--fg);font:13px/1.5 -apple-system,\"Segoe UI\",Roboto,\"Microsoft YaHei\",sans-serif;margin:0;padding:18px}\n  h1{font-size:17px;margin:0 0 4px}\n  .sub{color:var(--mut);margin:0 0 12px}\n  .row{display:grid;grid-template-columns:1fr 260px;gap:14px}\n  @media(max-width:860px){.row{grid-template-columns:1fr}}\n  textarea{width:100%;height:190px;background:#0b0f14;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 Consolas,monospace;resize:vertical}\n  .side{display:flex;flex-direction:column;gap:9px}\n  button{background:var(--acc);color:#04101f;border:none;border-radius:7px;padding:9px 12px;font-weight:600;cursor:pointer}\n  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}\n  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px}\n  .card h3{margin:0 0 7px;font-size:13px}\n  label{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:12px;margin-bottom:5px}\n  .stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}\n  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:96px}\n  .stat b{display:block;font-size:17px;color:var(--acc)}\n  .stat span{color:var(--mut);font-size:11px}\n  .card2{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:480px;margin-top:12px}\n  table{border-collapse:collapse;width:100%;font-size:12px}\n  th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}\n  th{color:var(--mut);position:sticky;top:0;background:var(--panel)}\n  td.no{font-family:Consolas,monospace}\n  a{color:var(--acc);text-decoration:none}\n  .legend{color:var(--mut);font-size:11px;margin-top:8px}\n</style>\n<script>window.__WB_PUBLIC__=true;</script><style>[data-private]{display:none !important}</style></head>\n<body>\n<h1>图纸列表清洗 · 真实 Schema</h1>\n<p class=\"sub\">粘贴系统搜索结果（含表头，Tab 分隔）→ 按真实列结构清洗。已预填你刚才的数据。离线运行。</p>\n\n<div class=\"row\">\n  <div><textarea id=\"inp\"></textarea></div>\n  <div class=\"side\">\n    <div class=\"card\">\n      <h3>清洗选项</h3>\n      <label><input type=\"checkbox\" id=\"o_dedup\" checked> 去重（完全重复行）</label>\n      <label><input type=\"checkbox\" id=\"o_no\" checked> 图号转大写/去空格</label>\n      <label><input type=\"checkbox\" id=\"o_ver\" checked> 版本合并（列→文件名兜底）</label>\n      <label><input type=\"checkbox\" id=\"o_type\" checked> 附件类型归类（归属/维度）</label>\n      <label><input type=\"checkbox\" id=\"o_time\" checked> 时间归一 ISO</label>\n      <label><input type=\"checkbox\" id=\"o_url\" checked> 反推 HTTP 链接（推测）</label>\n    </div>\n    <button id=\"run\">解析并清洗</button>\n    <button id=\"csv\" class=\"ghost\">导出 CSV</button>\n  </div>\n</div>\n\n<div class=\"stats\" id=\"stats\"></div>\n<div class=\"card2\"><div id=\"out\"></div></div>\n<p class=\"legend\"><b>归属</b>=公司/客户/产品 · <b>维度</b>=2D/3D/简图 · HTTP链接为按 <code style=\"color:#ffa657\">测试路径 ↔ <共享名></code> 推断，需在内网验证可达性。</p>\n\n<script>window.addEventListener('error',function(e){try{var v=document.getElementById('app')||document.getElementById('view')||document.body;if(!v||v.dataset.err)return;v.dataset.err='1';var s=(e.error&&e.error.stack)||e.message||'';var b=document.createElement('div');b.style.cssText='padding:16px;margin:14px;font-family:ui-monospace,monospace;font-size:13px;color:#a33;background:#fdeceb;border:1px solid #f5c6cb;border-radius:12px;line-height:1.5';b.innerHTML='<b>⚠ 页面出错了</b><br><span style=\"color:#555\">'+(e.message||'')+'</span><pre style=\"white-space:pre-wrap;margin-top:8px;font-size:11px\">'+(s||'').slice(0,1000)+'</pre><small style=\"color:#666\">建议 Ctrl+Shift+R 强刷；F12 → Application → Local Storage 清本页缓存后刷新。</small>';v.insertBefore(b,v.firstChild);}catch(_){}});\n// 预填：用户 15:19 提供的真实搜索结果（已含重复，用于演示去重）\nconst SAMPLE=[\n [\"下载\",\"查看图纸\",\"零件图号\",\"零件版本\",\"图纸版本\",\"更新时间\",\"附件类型\",\"路径\",\"工序\",\"客户订单号\",\"客户订单行\",\"附件全路径\"],\n [\"下载\",\"查看图纸\",\"PRJ000-001-001\",\"A\",\"A\",\"2026/7/7 11:35:36\",\"公司2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.pdf\"],\n [\"下载\",\"查看图纸\",\"PRJ000-001-001\",\"A\",\"A\",\"2026/7/7 11:35:36\",\"公司3D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司3D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.STEP\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司3D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.STEP\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"\",\"\",\"2026/6/12 15:25:51\",\"产品简图\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\产品简图\\\\20260611\\\\XP00-000-000000.jpg\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\产品简图\\\\20260611\\\\XP00-000-000000.jpg\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"客户2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户2D图纸\\\\20260423\\\\XP00-000-000000-A.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户2D图纸\\\\20260423\\\\XP00-000-000000-A.pdf\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"公司2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\20260423\\\\XP00-000-000000-A已翻译.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\20260423\\\\XP00-000-000000-A已翻译.pdf\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"客户3D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户3D图纸\\\\20260423\\\\XP00-000-000000.rar\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户3D图纸\\\\20260423\\\\XP00-000-000000.rar\"],\n [\"下载\",\"查看图纸\",\"PRJ000-001-001\",\"A\",\"A\",\"2026/7/7 11:35:36\",\"公司2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.pdf\"],\n [\"下载\",\"查看图纸\",\"PRJ000-001-001\",\"A\",\"A\",\"2026/7/7 11:35:36\",\"公司3D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司3D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.STEP\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司3D图纸\\\\<内网NAS>\\\\PRJ000-001-001_A.STEP\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"\",\"\",\"2026/6/12 15:25:51\",\"产品简图\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\产品简图\\\\20260611\\\\XP00-000-000000.jpg\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\产品简图\\\\20260611\\\\XP00-000-000000.jpg\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"客户2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户2D图纸\\\\20260423\\\\XP00-000-000000-A.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户2D图纸\\\\20260423\\\\XP00-000-000000-A.pdf\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"公司2D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\20260423\\\\XP00-000-000000-A已翻译.pdf\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\公司2D图纸\\\\20260423\\\\XP00-000-000000-A已翻译.pdf\"],\n [\"下载\",\"查看图纸\",\"XP00-000-000000\",\"A\",\"\",\"2026/4/23 13:14:55\",\"客户3D图纸\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户3D图纸\\\\20260423\\\\XP00-000-000000.rar\",\"\",\"\",\"\",\"\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\客户3D图纸\\\\20260423\\\\XP00-000-000000.rar\"],\n];\ndocument.getElementById('inp').value=SAMPLE.map(r=>r.join(\"\\t\")).join(\"\\n\");\n\nfunction parseTable(text){\n  const lines=text.split(/\\r?\\n/);\n  let hdr=-1,headers=[];\n  lines.forEach((l,i)=>{ if(l.includes(\"零件图号\")){headers=l.split(\"\\t\");hdr=i;} });\n  if(hdr<0)return [];\n  const ci={}; headers.forEach((h,i)=>ci[h.trim()]=i);\n  const get=(row,k)=> (ci[k]!=null&&row[ci[k]]!=null)?row[ci[k]].trim():\"\";\n  const rows=[];\n  for(let i=hdr+1;i<lines.length;i++){\n    const row=lines[i].split(\"\\t\");\n    const no=get(row,\"零件图号\");\n    if(!no||no===\"零件图号\")continue;\n    rows.push({no,pv:get(row,\"零件版本\"),dv:get(row,\"图纸版本\"),ts:get(row,\"更新时间\"),\n      at:get(row,\"附件类型\"),proc:get(row,\"工序\"),co:get(row,\"客户订单号\"),\n      col:get(row,\"客户订单行\"),path:get(row,\"附件全路径\")||get(row,\"路径\")});\n  }\n  return rows;\n}\nfunction verScore(v){if(!v)return 0;v=v.trim();if(/^V/i.test(v)){const n=parseFloat(v.slice(1));return isNaN(n)?0:n;}if(/^[A-Za-z]$/i.test(v))return v.toUpperCase().charCodeAt(0)-64;if(/^\\d+(\\.\\d+)?$/.test(v))return parseFloat(v);return 0;}\nfunction normTime(s){if(!s)return\"\";const m=s.trim().match(/(\\d{4})\\/(\\d{1,2})\\/(\\d{1,2})(?:\\s+(\\d{1,2}):(\\d{2})(?::(\\d{2}))?)?/);if(!m)return s;const[,y,mo,d,h,mi,se]=m;let r=`${y}-${String(mo).padStart(2,\"0\")}-${String(d).padStart(2,\"0\")}`;if(h!=null)r+=` ${String(h).padStart(2,\"0\")}:${String(mi).padStart(2,\"0\")}`+(se!=null?`:${String(se).padStart(2,\"0\")}`:\":00\");return r;}\nfunction folderDate(p){const m=p.match(/(\\d{8})/);if(!m)return\"\";const s=m[1];return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;}\nfunction verFromName(p){const m=p.replace(/^.*[\\\\\\/]/,\"\").match(/[-_]([A-Z])\\.[^.]+$/);return m?m[1]:\"\";}\nfunction ownerOf(at){if(at.startsWith(\"公司\"))return\"公司\";if(at.startsWith(\"客户\"))return\"客户\";if(at.startsWith(\"产品\"))return\"产品\";return\"其他\";}\nfunction dimOf(at){if(at.includes(\"2D\"))return\"2D\";if(at.includes(\"3D\"))return\"3D\";if(at.includes(\"简图\"))return\"简图\";return\"其他\";}\nfunction extOf(p){const m=p.match(/\\.([^.]+)$/);return m?m[1].toUpperCase():\"\";}\nfunction toHttp(unc){const pre=\"\\\\\\\\&lt;内网SMB&gt;\\\\<共享名>\\\\\";if(!unc.startsWith(pre))return\"\";const rest=unc.slice(pre.length).split(\"\\\\\");return \"http://&lt;内网图纸服务器&gt;/test/\"+rest.map(encodeURIComponent).join(\"/\");}\n\nlet LAST=[];\nfunction run(){\n  const o={dedup:document.getElementById('o_dedup').checked,no:document.getElementById('o_no').checked,ver:document.getElementById('o_ver').checked,type:document.getElementById('o_type').checked,time:document.getElementById('o_time').checked,url:document.getElementById('o_url').checked};\n  let rows=parseTable(document.getElementById('inp').value);\n  if(o.dedup){const seen=new Set();rows=rows.filter(r=>{const k=r.no+\"|\"+r.pv+\"|\"+r.dv+\"|\"+r.at+\"|\"+r.path;if(seen.has(k))return false;seen.add(k);return true;});}\n  rows.forEach(r=>{\n    if(o.no)r.no=r.no.toUpperCase().replace(/\\s+/g,\"\");\n    let v=\"\"; if(o.ver){ v=r.dv||r.pv||verFromName(r.path); }\n    r.ver=v; r.owner=o.type?ownerOf(r.at):\"\"; r.dim=o.type?dimOf(r.at):\"\";\n    r.fmt=extOf(r.path); r.fdate=folderDate(r.path);\n    r.tsISO=o.time?normTime(r.ts):r.ts;\n    r.http=o.url?toHttp(r.path):\"\";\n  });\n  LAST=rows;\n  const owners={},dims={};rows.forEach(r=>{owners[r.owner]=(owners[r.owner]||0)+1;dims[r.dim]=(dims[r.dim]||0)+1;});\n  const missVer=rows.filter(r=>!r.ver).length, missTime=rows.filter(r=>!r.ts).length;\n  document.getElementById('stats').innerHTML=`\n    <div class=\"stat\"><b>${SAMPLE.length-1}</b><span>粘贴行(含重复)</span></div>\n    <div class=\"stat\"><b style=\"color:var(--ok)\">${rows.length}</b><span>去重后</span></div>\n    <div class=\"stat\"><b>${new Set(rows.map(r=>r.no)).size}</b><span>独立图号</span></div>\n    <div class=\"stat\"><b style=\"color:var(--warn)\">${missVer}</b><span>缺版本</span></div>\n    <div class=\"stat\"><b style=\"color:var(--warn)\">${missTime}</b><span>缺更新时间</span></div>\n    <div class=\"stat\"><b style=\"color:var(--acc)\">${rows.filter(r=>r.http).length}</b><span>已反推链接</span></div>`;\n  document.getElementById('out').innerHTML=`<table><tr><th>零件图号</th><th>版本</th><th>附件类型</th><th>归属</th><th>维度</th><th>格式</th><th>更新时间</th><th>文件夹日期</th><th>推断HTTP链接</th></tr>${\n    rows.map(r=>`<tr><td class=\"no\">${r.no}</td><td>${r.ver||'<span style=\"color:var(--bad)\">缺</span>'}</td><td>${r.at}</td><td>${r.owner}</td><td>${r.dim}</td><td>${r.fmt}</td><td>${r.tsISO||'—'}</td><td>${r.fdate||'—'}</td><td>${r.http?`<a href=\"${r.http}\">${r.http}</a>`:'—'}</td></tr>`).join(\"\")\n  }</table>`;\n}\nfunction exportCSV(){\n  if(!LAST.length)return;\n  const head=[\"零件图号\",\"版本\",\"附件类型\",\"归属\",\"维度\",\"格式\",\"更新时间\",\"文件夹日期\",\"推断HTTP链接\",\"附件全路径\"];\n  const body=LAST.map(r=>[r.no,r.ver,r.at,r.owner,r.dim,r.fmt,r.tsISO,r.fdate,r.http,r.path].map(v=>`\"${v}\"`).join(\",\"));\n  const csv=\"\\uFEFF\"+[head.join(\",\"),...body].join(\"\\n\");\n  const a=document.createElement(\"a\");a.href=URL.createObjectURL(new Blob([csv],{type:\"text/csv\"}));a.download=\"drawings_clean.csv\";a.click();\n}\nrun();\ndocument.getElementById(\"run\").onclick=run;\ndocument.getElementById(\"csv\").onclick=exportCSV;\n</script>\n</body>\n</html>\n"
