<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>塔台 Tower · 个人指挥台</title>
<style>
  :root{
    /* 学习感 · 晨林绿（浅色） */
    --bg:#f6f8f5; --card:#ffffff; --primary:#0f9d77; --primary-soft:#e6f5ef;
    --text:#1d2723; --muted:#6b7d76; --red:#e0564b; --green:#1a9e5c;
    --amber:#d98a1a; --border:#e3e8e4; --ring-track:#eaf0ec; --note-bg:#f3f7f4; --input-bg:#ffffff;
    --radius:16px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  [data-theme="dark"]{
    /* 夜读（深色） */
    --bg:#0f1311; --card:#181d1a; --primary:#34d399; --primary-soft:#14352b;
    --text:#e8efe9; --muted:#8b9b93; --red:#f0715f; --green:#46c07e;
    --amber:#e0a04a; --border:#262d29; --ring-track:#222926; --note-bg:#1c2220; --input-bg:#0f1311;
  }
  [data-theme="dark"] .topbar{background:rgba(15,19,17,.82);border-color:var(--border);}
  [data-theme="dark"] .tabbar{background:rgba(24,29,26,.9);border-color:var(--border);}
  [data-theme="dark"] .backup-tip{background:#2a2410;border-color:#5a4a14;color:#f0d488;}
  [data-theme="dark"] .today{background:linear-gradient(180deg,#14352b 0%,#181d1a 60%);border-color:#1f4a3c;}
  [data-theme="dark"] body{color-scheme:dark;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  /* 顶部栏 */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(244,245,249,.85);backdrop-filter:blur(10px);
    padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  .topbar h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .backup-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .btn{min-height:44px;padding:9px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;transition:.15s;font-weight:600;}
  .btn:hover{border-color:#c7cad1;}
  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn.primary:hover{background:#4338ca;}
  .btn.ghost{background:transparent;}
  .btn.sm{min-height:36px;padding:6px 10px;font-size:13px;border-radius:10px;}
  .btn.icon{min-width:44px;justify-content:center;padding:9px;}
  .btn svg{width:18px;height:18px;flex:none;}
  .backup-tip{margin:10px 16px 0;background:#fffbeb;border:1px solid #fde68a;color:#92400e;
    padding:10px 14px;border-radius:12px;font-size:13px;display:none;}
  /* 容器 */
  .wrap{max-width:920px;margin:0 auto;padding:14px 16px 24px;}
  section{margin-bottom:26px;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;}
  .sec-head h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;font-weight:700;}
  .sec-head svg{width:20px;height:20px;color:var(--primary);}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
  /* 今日要处理 */
  .today{background:linear-gradient(180deg,#e6f5ef 0%,#ffffff 60%);border:1px solid #bfe6d6;}
  .today .count{font-size:13px;color:var(--primary);font-weight:700;}
  .todo{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);margin-bottom:10px;}
  .todo:last-child{margin-bottom:0;}
  .todo.overdue{border-color:#fecdd3;background:#fff5f6;}
  .todo .check{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--card);}
  .todo.done{opacity:.5;}
  .todo.done .title{text-decoration:line-through;}
  .todo .check svg{width:14px;height:14px;color:#fff;display:none;}
  .todo.checked .check{background:var(--green);border-color:var(--green);}
  .todo.checked .check svg{display:block;}
  .todo .body{flex:1;min-width:0;}
  .todo .title{font-weight:600;font-size:15px;word-break:break-word;}
  .todo .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:600;}
  .tag.over{background:#fee2e8;color:var(--red);}
  .tag.soon{background:#fef3c7;color:var(--amber);}
  .todo .actions{display:flex;gap:6px;flex:none;}
  /* 项目卡 */
  .proj{display:flex;gap:14px;align-items:center;}
  .proj .ring{flex:none;}
  .proj .info{flex:1;min-width:0;}
  .proj .pname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
  .proj .pmetric{font-size:13px;color:var(--muted);margin-top:2px;}
  .proj .pmetric b{color:var(--text);}
  .proj .pbar{height:6px;border-radius:99px;background:#eef0f4;margin-top:8px;overflow:hidden;}
  .proj .pbar i{display:block;height:100%;border-radius:99px;background:var(--primary);}
  .proj .pmeta{font-size:11px;color:var(--muted);margin-top:6px;}
  .chip{font-size:11px;padding:3px 9px;border-radius:999px;background:#f1f3f9;color:var(--muted);}
  .chip.red{background:#fee2e8;color:var(--red);}
  .chip.green{background:#dcfce7;color:var(--green);}
  /* 工具入口 */
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .tool{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
    cursor:pointer;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:8px;transition:.15s;}
  .tool:hover{border-color:#c7cad1;transform:translateY(-1px);}
  .tool .tname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
  .tool .tname svg{width:18px;height:18px;color:var(--primary);}
  .tool .tnote{font-size:12px;color:var(--muted);min-height:16px;}
  .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:999px;background:var(--red);
    color:#fff;font-size:12px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 6px;border:2px solid var(--card);}
  .badge.show{display:flex;}
  .tool .open{font-size:12px;color:var(--primary);font-weight:600;}
  /* 速记 */
  .note-add{display:flex;gap:8px;margin-bottom:12px;}
  .note-add input{flex:1;min-height:44px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;
    font-family:inherit;background:var(--card);color:var(--text);}
  .note-add input:focus{outline:none;border-color:var(--primary);}
  .note{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:12px;background:var(--note-bg);border:1px solid var(--border);margin-bottom:8px;}
  .note .txt{flex:1;font-size:14px;word-break:break-word;white-space:pre-wrap;}
  .note .del{flex:none;color:var(--muted);cursor:pointer;border:none;background:none;padding:4px;}
  .note .del svg{width:16px;height:16px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px;border:1px dashed var(--border);border-radius:12px;}
  /* 底部 Tab */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar a{flex:1;text-align:center;padding:8px 0 6px;color:var(--muted);text-decoration:none;font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;}
  .tabbar a svg{width:22px;height:22px;}
  .tabbar a.active{color:var(--primary);}
  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  /* PC 端：顶部横排 Tab，隐藏底部 */
  @media(min-width:768px){
    body{padding-bottom:0;}
    .tabbar{position:static;flex-direction:row;gap:4px;border-top:none;border-bottom:1px solid var(--border);
      background:var(--card);padding:0 16px;}
    .tabbar a{flex:none;flex-direction:row;padding:14px 16px;font-size:14px;gap:7px;border-bottom:2px solid transparent;}
    .tabbar a.active{border-bottom-color:var(--primary);}
    .topbar{padding:18px 16px 12px;}
    .wrap{padding-top:18px;}
  }
  /* 弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow:auto;}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--border);border-radius:12px;
    padding:10px 13px;font-size:16px;font-family:inherit;background:var(--card);color:var(--text);}
  .field textarea{min-height:70px;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;justify-content:center;}
  @media(min-width:768px){.modal-mask{align-items:center;}.modal{border-radius:20px;}}
</style>

    projects:[
      {id:"p1",name:"自动记账App",metric:"本月支出 ¥3,280（红）· 收入 ¥12,400（绿）",prog:65,update:shift(-1),link:""},
      {id:"p2",name:"追剧大全",metric:"已接入 12 个片源 · 联调中",prog:80,update:shift(-2),link:""},
      {id:"p3",name:"自由剧场",metric:"v1.1 已发布 · 打磨 v1.2",prog:90,update:shift(-4),link:""}
    ],
    tools:[
      {id:"o1",name:"邮箱",link:"https://mail.google.com",unread:5,note:"3封客户邮件待回"},
      {id:"o2",name:"GitHub",link:"https://github.com",unread:2,note:"2 个 PR 待 review"},
      {id:"o3",name:"飞书",link:"https://www.feishu.cn",unread:3,note:"周会纪要待整理"},
      {id:"o4",name:"云盘",link:"",unread:0,note:"设计稿已同步"}
    ],
    notes:[
      {id:"n1",txt:"下一步把三个项目的数据指标接进统一看板，减少来回切。",ts:Date.now()},
      {id:"n2",txt:"外部工具自动同步需要后端授权，先用手动标记顶着。",ts:Date.now()}
    ],
    _seeded:true
  };

  function load(){
    try{
      var raw = localStorage.getItem(KEY+"data");
      if(raw) return JSON.parse(raw);
    }catch(e){}
    localStorage.setItem(KEY+"data", JSON.stringify(seed));
    return JSON.parse(JSON.stringify(seed));
  }
  function save(){
    localStorage.setItem(KEY+"data", JSON.stringify(state));
    renderBackupTip();
  }
  var state = load();
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  // ---- 今日要处理 ----
  function todayItems(){
    var t=ymd(new Date());
    return state.todos.filter(function(x){return !x.done && x.due <= t;})
      .sort(function(a,b){return a.due < b.due ? -1 : 1;});
  }
  function renderToday(){
    var items = todayItems();
    $("#todayCount").textContent = items.length + " 项";
    var box = $("#todayList");
    if(!items.length){box.innerHTML='<div class="empty">今天没有待处理项，清爽 🎉</div>';return;}
    box.innerHTML = items.map(function(x){
      var over = x.due < ymd(new Date());
      var soon = !over && x.due === ymd(new Date());
      var cls = over ? "todo overdue" : "todo";
      var tag = over ? '<span class="tag over">逾期 '+x.due+'</span>'
              : soon ? '<span class="tag soon">今天截止</span>'
              : '<span class="tag">'+x.due+'</span>';
      return '<div class="'+cls+'" data-id="'+x.id+'">'
        +'<div class="check" data-act="check" data-id="'+x.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'
        +'<div class="body"><div class="title">'+esc(x.title)+'</div>'
        +'<div class="meta">'+tag+'<span class="tag">'+esc(x.source)+'</span><span>'+esc(x.type)+'</span></div></div>'
        +'<div class="actions"><button class="btn sm ghost" data-act="del" data-id="'+x.id+'">删除</button></div>'
        +'</div>';
    }).join("");
  }
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // ---- 项目 ----
  function ring(p){
    var pct=Math.max(0,Math.min(100,p));
    var off = (100-pct).toFixed(1);
    return '<svg class="ring" width="56" height="56" viewBox="0 0 36 36">'
      +'<circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--ring-track)" stroke-width="3.2"/>'
      +'<circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--primary)" stroke-width="3.2" stroke-dasharray="'+pct+' 100" stroke-dashoffset="0" transform="rotate(-90 18 18)" stroke-linecap="round"/>'
      +'<text x="18" y="21.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--text)">'+pct+'%</text></svg>';
  }
  function renderProjects(){
    var box=$("#projList");
    if(!state.projects.length){box.innerHTML='<div class="empty">还没有项目，点右上角添加。</div>';return;}
    box.innerHTML = state.projects.map(function(p){
      var red = /红|支出/.test(p.metric);
      var green = /绿|收入/.test(p.metric);
      var chip = red ? '<span class="chip red">含支出</span>' : green ? '<span class="chip green">含收入</span>' : '';
      var link = p.link ? '<a class="chip" href="'+esc(p.link)+'" target="_blank" rel="noopener" style="text-decoration:none;color:var(--primary)">打开 ↗</a>' : '';
      return '<div class="card"><div class="proj">'+ring(p.prog)
        +'<div class="info"><div class="pname">'+esc(p.name)+' '+chip+'</div>'
        +'<div class="pmetric"><b>'+esc(p.metric)+'</b></div>'
        +'<div class="pbar"><i style="width:'+p.prog+'%"></i></div>'
        +'<div class="pmeta">最近更新 '+esc(p.update||"—")+' · '+link+'</div></div>'
        +'<button class="btn sm ghost" data-act="delp" data-id="'+p.id+'">删除</button>'
        +'</div></div>';
    }).join("");
  }

  // ---- 工具 ----
  function renderTools(){
    var box=$("#toolsGrid");
    if(!state.tools.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">还没有工具入口，点右上角添加。</div>';return;}
    box.innerHTML = state.tools.map(function(t){
      var badge = (t.unread>0) ? '<span class="badge show">'+t.unread+'</span>' : '';
      var href = t.link ? 'href="'+esc(t.link)+'" target="_blank" rel="noopener"' : 'style="cursor:default"';
      return '<a class="tool" '+href+' data-id="'+t.id+'">'+badge
        +'<div class="tname"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'+esc(t.name)+'</div>'
        +'<div class="tnote">'+esc(t.note||"")+'</div>'
        +'<div class="open">'+(t.link?'打开 ↗':'未设置链接')+'</div>'
        +'</a>';
    }).join("");
  }

  // ---- 速记 ----
  function renderNotes(){
    var box=$("#noteList");
    if(!state.notes.length){box.innerHTML='<div class="empty">还没有速记。</div>';return;}
    box.innerHTML = state.notes.slice().reverse().map(function(n){
      return '<div class="note"><div class="txt">'+esc(n.txt)+'</div>'
        +'<button class="del" data-act="deln" data-id="'+n.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div>';
    }).join("");
  }

  // ---- 备份提示 ----
  function renderBackupTip(){
    var n = state.todos.length+state.projects.length+state.tools.length+state.notes.length;
    var tip=$("#backupTip");
    if(n>=30){tip.style.display="block";tip.textContent="数据已积累 "+n+" 条，建议点「导出备份」存一份 JSON，防止误清。";}
    else tip.style.display="none";
  }

  function renderAll(){renderToday();renderProjects();renderTools();renderNotes();renderBackupTip();}

  // ---- 交互 ----
  document.addEventListener("click",function(e){
    var act=e.target.closest("[data-act]");
    if(act){
      var id=act.getAttribute("data-id");
      if(act.getAttribute("data-act")==="check"){
        var t=state.todos.find(function(x){return x.id===id;}); if(t){t.done=true;save();renderToday();}
      }else if(act.getAttribute("data-act")==="del"){
        state.todos=state.todos.filter(function(x){return x.id!==id;});save();renderToday();
      }else if(act.getAttribute("data-act")==="delp"){
        state.projects=state.projects.filter(function(x){return x.id!==id;});save();renderProjects();
      }else if(act.getAttribute("data-act")==="deln"){
        state.notes=state.notes.filter(function(x){return x.id!==id;});save();renderNotes();
      }
      return;
    }
    if(e.target.closest("[data-close]")){closeModals();}
  });

  // 工具角标点击（无链接时编辑）
  $("#toolsGrid").addEventListener("click",function(e){
    var el=e.target.closest(".tool"); if(!el)return;
    if(!el.getAttribute("href")){ /* 无链接，暂不做编辑，避免误触 */ }
  });

  // ---- Tab 切换 ----
  function setView(v){
    $$(".view").forEach(function(s){s.classList.remove("active");});
    $("#"+v).classList.add("active");
    $$("#tabbar a").forEach(function(a){a.classList.toggle("active",a.getAttribute("data-view")===v);});
    if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  }
  $("#tabbar").addEventListener("click",function(e){
    var a=e.target.closest("a[data-view]"); if(!a)return; e.preventDefault(); setView(a.getAttribute("data-view"));
  });

  // ---- 弹层 ----
  function openModal(id){$("#"+id).classList.add("show");}
  function closeModals(){$$(".modal-mask").forEach(function(m){m.classList.remove("show");});}
  $$(".modal-mask").forEach(function(m){
    m.addEventListener("click",function(e){if(e.target===m)closeModals();});
  });

  $("#btnAddTodo").onclick=function(){ $("#tDue").value=ymd(new Date()); openModal("modalTodo"); $("#tTitle").focus(); };
  $("#tSave").onclick=function(){
    var title=$("#tTitle").value.trim(); if(!title){$("#tTitle").focus();return;}
    state.todos.push({id:uid(),title:title,source:$("#tSource").value.trim()||"未分类",
      type:$("#tType").value,due:$("#tDue").value||ymd(new Date()),done:false});
    save();renderToday();closeModals();resetForm("tTitle","tSource");
  };
  $("#btnAddProj").onclick=function(){openModal("modalProj");$("#pName").focus();};
  $("#pSave").onclick=function(){
    var name=$("#pName").value.trim(); if(!name){$("#pName").focus();return;}
    var prog=parseInt($("#pProg").value,10); if(isNaN(prog))prog=0;
    state.projects.push({id:uid(),name:name,metric:$("#pMetric").value.trim()||"—",
      prog:Math.max(0,Math.min(100,prog)),update:$("#pUpdate").value||ymd(new Date()),link:$("#pLink").value.trim()});
    save();renderProjects();closeModals();resetForm("pName","pMetric","pProg","pUpdate","pLink");
  };
  $("#btnAddTool").onclick=function(){openModal("modalTool");$("#oName").focus();};
  $("#oSave").onclick=function(){
    var name=$("#oName").value.trim(); if(!name){$("#oName").focus();return;}
    var u=parseInt($("#oUnread").value,10); if(isNaN(u))u=0;
    state.tools.push({id:uid(),name:name,link:$("#oLink").value.trim(),unread:u,note:$("#oNote").value.trim()});
    save();renderTools();closeModals();resetForm("oName","oLink","oUnread","oNote");
  };
  function resetForm(){for(var i=0;i<arguments.length;i++){var el=$("#"+arguments[i]);if(el)el.value="";}}

  // ---- 速记 ----
  function addNote(){
    var v=$("#noteInput").value.trim(); if(!v)return;
    state.notes.push({id:uid(),txt:v,ts:Date.now()});save();renderNotes();$("#noteInput").value="";
  }
  $("#btnAddNote").onclick=addNote;
  $("#noteInput").addEventListener("keydown",function(e){if(e.key==="Enter")addNote();});

  // ---- 导出 / 导入 / 清空 ----
  $("#btnExport").onclick=function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="塔台Tower备份_"+ymd(new Date())+".json"; a.click(); URL.revokeObjectURL(a.href);
  };
  $("#btnImport").onclick=function(){$("#fileInput").click();};
  $("#fileInput").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!confirm("导入将覆盖当前所有数据，确定继续？"))return;
        if(!data.todos)data.todos=[]; if(!data.projects)data.projects=[];
        if(!data.tools)data.tools=[]; if(!data.notes)data.notes=[];
        state=data; save(); renderAll();
        alert("导入成功，共 "+(state.todos.length+state.projects.length+state.tools.length+state.notes.length)+" 条数据。");
      }catch(err){alert("文件格式不正确，导入失败。");}
    };
    r.readAsText(f); e.target.value="";
  });
  $("#btnClearSample").onclick=function(){
    if(!confirm("清空所有示例与录入数据？此操作不可恢复，建议先导出备份。"))return;
    localStorage.removeItem(KEY+"data");
    state = JSON.parse(JSON.stringify(seed));
    localStorage.setItem(KEY+"data",JSON.stringify(state));
    renderAll();
  };

  // ---- 深色 / 浅色主题 ----
  var THEME_KEY=KEY+"theme";
  function applyTheme(t){document.documentElement.setAttribute("data-theme",t);updateThemeIcon(t);}
  function updateThemeIcon(t){
    var sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
    var el=$("#btnTheme"); if(el) el.innerHTML=(t==="dark")?sun:moon;
  }
  applyTheme(localStorage.getItem(THEME_KEY)||"light");
  $("#btnTheme").onclick=function(){
    var next=(document.documentElement.getAttribute("data-theme")==="dark")?"light":"dark";
    applyTheme(next); localStorage.setItem(THEME_KEY,next);
  };

  // 初始视图
  var init = location.hash.replace("#","");
  if(init && $("#"+init)) setView(init); else setView("sec-today");
  renderAll();
})();
</script>
</body>
</html>
