<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>计算机二级 · 操作题真题库</title>
<style>
  :root{
    --green:#0f9d77; --green-d:#0c7d5e; --ink:#1c2522; --muted:#6b7a74;
    --bg:#f4f7f5; --card:#ffffff; --border:#e3eae6; --shadow:0 2px 10px rgba(15,157,119,.08);
    --word:#2b6cb0; --excel:#0f9d77; --ppt:#dd6b20;
    --amber:#e08a00; --pink:#FF6B6B; --teal:#4ECDC4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom);}
  a{color:inherit;text-decoration:none;}
  .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);padding:10px 16px;}
  .top-row{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto;}
  .back{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:9px;}
  .back:hover{background:#eef3f0;}
  .back svg{width:16px;height:16px;}
  .title{font-weight:800;font-size:16px;}
  .grad{background:linear-gradient(90deg,var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero{max-width:980px;margin:14px auto 0;padding:0 16px;}
  .hero-card{background:linear-gradient(120deg,#0f9d77,#13b98c 60%,#4ECDC4);border-radius:16px;padding:16px 18px;color:#fff;
    box-shadow:0 8px 24px rgba(15,157,119,.25);}
  .hero-card h1{margin:0;font-size:18px;font-weight:800;}
  .hero-card p{margin:6px 0 0;font-size:12.5px;opacity:.92;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .stat{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 4px;text-align:center;}
  .stat b{display:block;font-size:19px;font-weight:800;line-height:1.1;}
  .stat span{font-size:11px;opacity:.9;}
  .wrap{max-width:980px;margin:14px auto;padding:0 16px 40px;}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .chip{border:1px solid var(--border);background:var(--card);color:var(--muted);padding:7px 13px;border-radius:20px;
    font-size:13px;cursor:pointer;user-select:none;transition:.15s;}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}
  .chip.w.on{background:var(--word);border-color:var(--word);}
  .chip.e.on{background:var(--excel);border-color:var(--excel);}
  .chip.p.on{background:var(--ppt);border-color:var(--ppt);}
  .chip.c.on{background:#7c3aed;border-color:#7c3aed;}
  .search{flex:1;min-width:140px;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:14px;background:var(--card);}
  .search:focus{outline:none;border-color:var(--green);}
  .list{display:grid;gap:10px;}
  .q{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 14px;cursor:pointer;
    box-shadow:var(--shadow);transition:.15s;display:flex;gap:12px;align-items:flex-start;}
  .q:active{transform:scale(.99);}
  .qtag{flex:none;font-size:11px;font-weight:700;color:#fff;border-radius:7px;padding:3px 7px;margin-top:2px;white-space:nowrap;}
  .qtag.Word{background:var(--word);}.qtag.Excel{background:var(--excel);}.qtag.PPT{background:var(--ppt);}.qtag.Choice{background:#7c3aed;}
  .qbody{flex:1;min-width:0;}
  .qhead{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .qset{font-size:12px;color:var(--muted);font-weight:600;}
  .badge{font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;}
  .b-done{background:#e6f6ef;color:var(--green);}
  .b-master{background:#fff3e0;color:var(--amber);}
  .b-fav{background:#fdeef0;color:var(--pink);}
  .qprev{font-size:12.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .stem{font-size:14px;font-weight:600;line-height:1.5;}
  .opts{display:grid;gap:8px;margin-top:10px;}
  .opt{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;transition:.15s;background:var(--card);}
  .opt.ok{background:#e6f6ef;border-color:var(--green);color:var(--green);font-weight:700;}
  .opt.dim{opacity:.45;}
  .ans{margin-top:12px;}
  .a-title{font-weight:700;color:var(--amber);margin:10px 0 4px;}
  .analysis{font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:var(--ink);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,30,26,.5);z-index:40;display:none;align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;border-radius:18px 18px 0 0;overflow:auto;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease;}
  @keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .sh-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .sheet h2{margin:0;font-size:17px;font-weight:800;}
  .close{margin-left:auto;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 6px;}
  .req{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:6px;}
  .req .rh{font-weight:700;font-size:13px;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .req ol{margin:0;padding-left:20px;}
  .req li{margin:5px 0;font-size:14px;}
  .req li.t0{list-style:none;margin-left:-20px;font-weight:600;color:var(--ink);}
  .note{background:#fff8ec;border:1px solid #ffe2b0;color:#9a6b00;border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;}
  .note b{color:#7a5200;}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{flex:1;min-width:110px;border:none;border-radius:11px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;color:#fff;
    display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;}
  .btn.g{background:var(--green);}.btn.am{background:var(--amber);}.btn.p{background:var(--pink);}.btn.ghost{background:#eef3f0;color:var(--muted);}
  @media(min-width:680px){.mask{align-items:center;}.sheet{border-radius:18px;}}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr);}.stat b{font-size:17px;}}
</style>
</head>

   "11.在封面页之后，为报告插入目录页，目录样式为“自动目录1”，且使目录页面位于独立的节中。",
   "12.根据下列要求，对文档末尾的表格进行处理，完成效果可参考考生文件夹下的图片Wpic03.jpg:",
   "①将表格的文字环绕方式设置为无，并适当调整表格的行高和列宽。",
   "②将表格第2行左侧单元格中的文本“你的办公机构”替换为自定义属性“部门”中的内容，要求文本可随着属性的变化而更新。",
   "③在表格第2行右侧单元格插入域，显示可自动更新的日期，格式为“××××年×月×日”，并右对齐。",
   "④为表格第5行中的文本“员工薪金”插入尾注，尾注内容为表格最后一行中的内容，编号格式为预设的“*,+,╪,§’,...”样式，并删除表格最后一行。",
   "⑤在表格末尾“预估启动预算”一行右侧单元格，使用公式插入所有项目的总成本之和，格式为“￥#,##0.00;(￥#,##0.00)”。",
   "⑥为表格的第1行、第3行和最后一行设置适当的底纹。",
   "13.将文档中的批注标记为解决(完成)。",
   "14.从正文部分开始，在文档的页脚插入页码，页码从1开始，并更新目录。"
  ],
  "analysis": null
 },
 {
  "set": 0,
  "sub": 1,
  "type": "Choice",
  "stem": "一个栈的初始状态为空。现将元素1、2、3、4、5、A、B、C、D、E依次入栈，然后再依次出栈，则元素出栈的顺序是（）",
  "options": [
   "12345ABCDE",
   "EDCBA54321",
   "ABCDE12345",
   "54321EDCBA"
  ],
  "answer": "B",
  "analysis": "栈中插入元素的规则是“先进后出”或“后进先出”，所以选B。",
  "req": [],
  "link": "file:///F:/xhktSoft/office2/chioce.htm"
 }
];

const TYPE_LABEL = {Word:'Word', Excel:'Excel', PPT:'PPT', Choice:'选择题'};
const KEY = 'wb_c2bank_v1';
let state = load();
let curType = 'all', curKw = '';

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {done:[],master:[],fav:[]}; }
  catch(e){ return {done:[],master:[],fav:[]}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function has(arr,id){ return arr.indexOf(id)>=0; }
function toggle(arr,id){ const i=arr.indexOf(id); if(i>=0)arr.splice(i,1); else arr.push(id); }
function idOf(q){ return q.set+'-'+q.sub; }

function renderStats(){
  const done=new Set(state.done), master=new Set(state.master), fav=new Set(state.fav);
  document.getElementById('stTotal').textContent = BANK.length;
  document.getElementById('stDone').textContent = done.size;
  document.getElementById('stMaster').textContent = master.size;
  document.getElementById('stFav').textContent = fav.size;
  const hs = document.getElementById('heroSub');
  if(hs) hs.textContent = '共 '+BANK.length+' 道真题 · 21 套历年操作题 + 选择题 · 点开即可练习，进度自动保存在本机';
}

function renderList(){
  const kw = curKw.trim();
  let items = BANK.filter(function(q){
    if(curType!=='all' && q.type!==curType) return false;
    if(kw){
      const hay = (q.req.join(' ')).toLowerCase();
      if(hay.indexOf(kw.toLowerCase())<0) return false;
    }
    return true;
  });
  const list = document.getElementById('list');
  if(!items.length){ list.innerHTML='<div class="empty">没有匹配的题，换个关键词或筛选试试 🔍</div>'; return; }
  list.innerHTML = items.map(function(q){
    const id=idOf(q);
    let badge='';
    if(has(state.master,id)) badge='<span class="badge b-master">已掌握</span>';
    else if(has(state.done,id)) badge='<span class="badge b-done">已练</span>';
    if(has(state.fav,id)) badge+='<span class="badge b-fav">★收藏</span>';
    const prev = q.type==='Choice' ? q.stem : q.req.slice(0,2).join(' ');
    return '<div class="q" data-id="'+id+'">'
      +'<span class="qtag '+q.type+'">'+TYPE_LABEL[q.type]+'</span>'
      +'<div class="qbody"><div class="qhead"><span class="qset">第'+q.set+'套 · 第'+q.sub+'题</span>'+badge+'</div>'
      +'<div class="qprev">'+esc(prev)+'</div></div></div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('.q'), function(el){
    el.addEventListener('click', function(){ openDetail(el.getAttribute('data-id')); });
  });
}

function openDetail(id){
  const q = BANK.find(function(x){return idOf(x)===id;});
  if(!q) return;
  const isDone=has(state.done,id), isMaster=has(state.master,id), isFav=has(state.fav,id);
  const sheet = document.getElementById('sheet');
  // ===== 选择题分支 =====
  if(q.type==='Choice'){
    const L=['A','B','C','D'];
    const optHtml = q.options.map(function(o,i){
      return '<div class="opt" data-opt="'+L[i]+'">'+L[i]+'. '+esc(o)+'</div>';
    }).join('');
    sheet.innerHTML =
      '<div class="sh-top"><span class="qtag '+q.type+'">选择题</span>'
      +'<h2>选择题 · 第'+q.sub+'题</h2>'
      +'<span class="close" id="closeBtn">×</span></div>'
      +'<div class="req"><div class="rh">📝 题目</div><div class="stem">'+esc(q.stem)+'</div></div>'
      +'<div class="opts" id="opts">'+optHtml+'</div>'
      +'<div class="ans" id="ansBox" style="display:none">'
        +'<div class="a-title">✅ 正确答案：'+esc(q.answer)+'</div>'
        +'<div class="req"><div class="rh">💡 解析</div><div class="analysis">'+esc(q.analysis)+'</div></div>'
      +'</div>'
      + (q.link ? '<div class="note" id="jumpNote" style="display:none">⚠️ 当前是在线版，浏览器安全限制无法访问你电脑里的 office2 软件。请用<b>本地版指挥台</b>（以 <code>file://</code> 打开本机 c2-bank.html）点击此按钮，即可跳转到本机原题页练习。</div>' : '')
      +'<div class="acts">'
        +'<button class="btn g" id="bAns">显示答案</button>'
        + (q.link ? '<a class="btn am" id="bJump" href="'+q.link+'" target="_blank" rel="noopener">🖥 软件中练习</a>' : '')
        +'<button class="btn '+(isFav?'p':'ghost')+'" id="bFav">'+(isFav?'★ 已收藏':'☆ 收藏')+'</button>'
      +'</div>';
    document.getElementById('closeBtn').onclick = closeDetail;
    document.getElementById('bAns').onclick = function(){
      document.getElementById('ansBox').style.display='block';
      Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(el){
        const o = el.getAttribute('data-opt');
        if(o===q.answer){ el.classList.add('ok'); }
        else { el.classList.add('dim'); }
      });
      this.style.display='none';
    };
    document.getElementById('bFav').onclick = function(){ toggle(state.fav,id); save(); renderStats(); renderList(); openDetail(id); };
    const bj = document.getElementById('bJump');
    if(bj){ bj.addEventListener('click', function(e){
      if(location.protocol !== 'file:'){ e.preventDefault(); const n=document.getElementById('jumpNote'); if(n) n.style.display='block'; }
    }); }
    document.getElementById('mask').classList.add('show');
    sheet.scrollTop = 0;
    return;
  }
  // ===== 操作题分支 =====
  const reqHtml = q.req.map(function(t,i){
    if(/^[\d（(]/.test(t) && t.length<40 && /[、。：:]/.test(t)) return '<li class="t0">'+esc(t)+'</li>';
    return '<li>'+esc(t)+'</li>';
  }).join('');
  sheet.innerHTML =
    '<div class="sh-top"><span class="qtag '+q.type+'">'+TYPE_LABEL[q.type]+'</span>'
    +'<h2>第'+q.set+'套 · 第'+q.sub+'题</h2>'
    +'<span class="close" id="closeBtn">×</span></div>'
    +'<div class="req"><div class="rh">📋 题目要求</div><ol>'+reqHtml+'</ol></div>'
    + (q.analysis
        ? '<div class="req"><div class="rh">📝 文字解析</div><div class="analysis">'+esc(q.analysis)+'</div></div>'
        : '<div class="note">📝 <b>文字解析</b>：源题库包为混淆/加密格式，本环境已尽力提取；若某题解析缺失或残缺，请在该考试软件中查看完整版。</div>')
    +'<div class="acts">'
      +'<button class="btn g" id="bDone">'+(isDone?'✓ 已练':'标记已练')+'</button>'
      +'<button class="btn am" id="bMaster">'+(isMaster?'✓ 已掌握':'标记已掌握')+'</button>'
      +'<button class="btn '+(isFav?'p':'ghost')+'" id="bFav">'+(isFav?'★ 已收藏':'☆ 收藏')+'</button>'
    +'</div>';
  document.getElementById('closeBtn').onclick = closeDetail;
  document.getElementById('bDone').onclick = function(){ toggle(state.done,id); save(); renderStats(); renderList(); openDetail(id); };
  document.getElementById('bMaster').onclick = function(){ toggle(state.master,id); if(has(state.master,id)){ if(!has(state.done,id)) state.done.push(id); } save(); renderStats(); renderList(); openDetail(id); };
  document.getElementById('bFav').onclick = function(){ toggle(state.fav,id); save(); renderStats(); renderList(); openDetail(id); };
  document.getElementById('mask').classList.add('show');
  sheet.scrollTop = 0;
}
function closeDetail(){ document.getElementById('mask').classList.remove('show'); }

document.getElementById('mask').addEventListener('click', function(e){ if(e.target===this) closeDetail(); });
document.getElementById('search').addEventListener('input', function(e){ curKw=e.target.value; renderList(); });
Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
    c.classList.add('on'); curType=c.getAttribute('data-type'); renderList();
  });
});

function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }

renderStats();
renderList();
</script>
</body>
</html>
